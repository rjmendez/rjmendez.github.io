<svg xmlns="http://www.w3.org/2000/svg" width="1090" height="300" viewBox="0 0 1090 300" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="13" fill="#1a1a1a">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker></defs>
<text x="20" y="22" font-weight="600" font-size="14">How the listening engine decides what to play</text>
<rect x="20" y="62" width="190" height="72" rx="6" fill="#f7f9fc" stroke="#2c6cb0" stroke-width="1.5"/><text x="115" y="84" text-anchor="middle" font-size="13" font-weight="600">Target</text>
<text x="115" y="102" text-anchor="middle" font-size="11" fill="#555555">one array's bearing, or the</text><text x="115" y="117" text-anchor="middle" font-size="11" fill="#555555">fused target when there is one</text>
<rect x="20" y="150" width="190" height="46" rx="6" fill="#fdf8ee" stroke="#999999" stroke-width="1.5" stroke-dasharray="5 4"/><text x="115.0" y="178.0" text-anchor="middle" font-size="12.5" font-weight="600">Auto-follow</text>
<text x="115" y="214" text-anchor="middle" font-size="10.5" fill="#555555">picks its target from the</text><text x="115" y="226" text-anchor="middle" font-size="10.5" fill="#555555">hub's fused-target state</text>
<line x1="210" y1="98" x2="270" y2="98" stroke="#555555" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="272" y="70" width="220" height="56" rx="6" fill="#f7f9fc" stroke="#2c6cb0" stroke-width="1.5"/><text x="382.0" y="94.0" text-anchor="middle" font-size="13" font-weight="600">Delay-and-sum beam</text><text x="382.0" y="111.0" text-anchor="middle" font-size="11.5" fill="#555555">20 ms chunks, fractional delays</text>
<line x1="492" y1="98" x2="552" y2="98" stroke="#555555" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="554" y="70" width="220" height="56" rx="6" fill="#f7f9fc" stroke="#2c6cb0" stroke-width="1.5"/><text x="664.0" y="94.0" text-anchor="middle" font-size="13" font-weight="600">Align arrays</text><text x="664.0" y="111.0" text-anchor="middle" font-size="11.5" fill="#555555">by cross-correlation</text>
<line x1="774" y1="98" x2="834" y2="98" stroke="#555555" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="836" y="56" width="234" height="40" rx="6" fill="#f7f9fc" stroke="#2e7d32" stroke-width="1.5"/><text x="953.0" y="81.0" text-anchor="middle" font-size="12.5" font-weight="600">Locked: play both arrays</text>
<rect x="836" y="104" width="234" height="40" rx="6" fill="#fdf8ee" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5 4"/><text x="953.0" y="129.0" text-anchor="middle" font-size="12.5" font-weight="600">No lock: play one array</text>
<rect x="20" y="250" width="1050" height="39" rx="6" fill="#f7f9fc" stroke="#999999" stroke-width="1.5"/><text x="36" y="271" text-anchor="start" font-size="11.5" fill="#1a1a1a">Host-side, on the PC. It steers a delay-and-sum beam on the stock Dante audio; nothing here runs on the arrays.</text>
</svg>
