<svg xmlns="http://www.w3.org/2000/svg" width="960" height="212" viewBox="0 0 960 212" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="13" fill="#1a1a1a">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker></defs>
<text x="20" y="22" font-weight="600" font-size="14">iCE40 HX1K, 256 KCs: does the FPGA match the reference?</text>
<text x="20" y="40" font-size="12" fill="#555555">golden vectors from the host reference; every output compared</text>
<text x="178" y="84" text-anchor="end" font-weight="600">RTL simulation</text>
<rect x="190" y="62" width="620.0" height="32" fill="#2e7d32" opacity="0.85"/>
<rect x="190" y="62" width="620" height="32" fill="none" stroke="#9a9a9a"/>
<text x="822" y="77" font-size="12.5">2,762 / 2,762</text>
<text x="822" y="93" font-size="11.5" fill="#555555">all match</text>
<text x="178" y="146" text-anchor="end" font-weight="600">hardware in the loop</text>
<rect x="190" y="124" width="619.816947150871" height="32" fill="#2e7d32" opacity="0.85"/>
<rect x="804" y="124" width="6" height="32" fill="#b8860b"/>
<rect x="190" y="124" width="620" height="32" fill="none" stroke="#9a9a9a"/>
<text x="822" y="139" font-size="12.5">3,386 / 3,387</text>
<text x="822" y="155" font-size="11.5" fill="#555555">1 timeout, 0 wrong</text>
<text x="190" y="200" font-size="12">Task accuracy on that set: <tspan font-weight="600">0.892</tspan> on hardware and on the reference (the miss was a timeout, not a different answer).</text>
</svg>
