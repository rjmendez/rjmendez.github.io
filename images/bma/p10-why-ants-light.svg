<svg xmlns="http://www.w3.org/2000/svg" width="1090" height="400" viewBox="0 0 1090 400" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="13" fill="#1a1a1a">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker></defs>
<text x="20" y="22" font-weight="600" font-size="14">Where the ants come from, and the five jobs they have on the array</text>
<rect x="20" y="44" width="330" height="250" rx="6" fill="#fdf8ee" stroke="#999999" stroke-width="1.5" stroke-dasharray="5 4"/><text x="185.0" y="66" text-anchor="middle" font-size="13" font-weight="600">A separate project, unreleased</text>
<text x="185" y="86" text-anchor="middle" font-size="11.5" fill="#555555">each ant: a small model</text><text x="185" y="102" text-anchor="middle" font-size="11.5" fill="#555555">watching one raw data stream</text><text x="185" y="118" text-anchor="middle" font-size="11.5" fill="#555555"></text><text x="185" y="134" text-anchor="middle" font-size="11.5" fill="#555555">shown as an ant farm</text><text x="185" y="150" text-anchor="middle" font-size="11.5" fill="#555555"></text><text x="185" y="166" text-anchor="middle" font-size="11.5" fill="#555555">no ant is clever</text><text x="185" y="182" text-anchor="middle" font-size="11.5" fill="#555555">the behaviour comes from many</text><text x="185" y="198" text-anchor="middle" font-size="11.5" fill="#555555">reacting together</text><text x="185" y="214" text-anchor="middle" font-size="11.5" fill="#555555"></text><text x="185" y="230" text-anchor="middle" font-size="11.5" fill="#555555">jobs there: anomaly detection,</text><text x="185" y="246" text-anchor="middle" font-size="11.5" fill="#555555">fast reflex</text>
<line x1="350" y1="170" x2="410" y2="170" stroke="#555555" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="380" y="140" text-anchor="middle" font-size="10.5" fill="#555555">borrowed</text><text x="380" y="152" text-anchor="middle" font-size="10.5" fill="#555555">idea</text>
<rect x="412" y="44" width="658" height="250" rx="6" fill="#f7f9fc" stroke="#2c6cb0" stroke-width="1.5" stroke-dasharray="5 4"/><text x="741.0" y="66" text-anchor="middle" font-size="13" font-weight="600">On the array (design; only the first small piece exists, in simulation)</text>
<rect x="428" y="76" width="626" height="36" rx="5" fill="#f7f9fc" stroke="#2c6cb0" stroke-width="1.5"/>
<text x="440" y="91" font-size="12.5" font-weight="600">Anomaly detection</text>
<text x="440" y="106" font-size="11" fill="#555555">baseline per feature; alarm when a window leaves it</text>
<text x="1044" y="98" text-anchor="end" font-size="11" fill="#555555">gate piece in RTL, simulation</text>
<rect x="428" y="118" width="626" height="36" rx="5" fill="#f7f9fc" stroke="#999999" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="440" y="133" font-size="12.5" font-weight="600">Fast reflex</text>
<text x="440" y="148" font-size="11" fill="#555555">respond to a fast impulse without waiting; target not set</text>
<text x="1044" y="140" text-anchor="end" font-size="11" fill="#555555">design only</text>
<rect x="428" y="160" width="626" height="36" rx="5" fill="#f7f9fc" stroke="#999999" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="440" y="175" font-size="12.5" font-weight="600">Target acquisition</text>
<text x="440" y="190" font-size="11" fill="#555555">notice something new in a beam, keep the evidence</text>
<text x="1044" y="182" text-anchor="end" font-size="11" fill="#555555">design only</text>
<rect x="428" y="202" width="626" height="36" rx="5" fill="#f7f9fc" stroke="#999999" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="440" y="217" font-size="12.5" font-weight="600">Tracking</text>
<text x="440" y="232" font-size="11" fill="#555555">follow it across beams and windows; expire it explicitly</text>
<text x="1044" y="224" text-anchor="end" font-size="11" fill="#555555">design only</text>
<rect x="428" y="244" width="626" height="36" rx="5" fill="#f7f9fc" stroke="#999999" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="440" y="259" font-size="12.5" font-weight="600">Data enrichment</text>
<text x="440" y="274" font-size="11" fill="#555555">attach what the ants saw, so the hub gets a labelled event</text>
<text x="1044" y="266" text-anchor="end" font-size="11" fill="#555555">design only</text>
<rect x="20" y="316" width="1050" height="56" rx="6" fill="#f7f9fc" stroke="#999999" stroke-width="1.5"/><text x="36" y="337" text-anchor="start" font-size="11.5" fill="#1a1a1a">Why: raw audio from 121 microphones cannot all go to the hub, so each array decides locally what is worth sending, and quickly.</text><text x="36" y="354" text-anchor="start" font-size="11.5" fill="#1a1a1a">The big models (Perch, BirdNET) stay on the hub, where the GPU is. No ant output has come from a live array.</text>
</svg>
