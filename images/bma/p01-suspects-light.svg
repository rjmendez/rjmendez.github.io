<svg xmlns="http://www.w3.org/2000/svg" width="1090" height="316" viewBox="0 0 1090 316" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="13" fill="#1a1a1a">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker></defs>
<text x="20" y="22" font-weight="600" font-size="14">Where a wrong bearing can come from, and which part of the series looks there</text>
<rect x="20" y="56" width="160" height="62" rx="6" fill="#f7f9fc" stroke="#2c6cb0" stroke-width="1.5"/><text x="100.0" y="83.0" text-anchor="middle" font-size="12.5" font-weight="600">Microphones</text><text x="100.0" y="100.0" text-anchor="middle" font-size="11.5" fill="#555555">121 elements</text>
<line x1="100.0" y1="118" x2="100.0" y2="160" stroke="#999999" stroke-width="1.3" stroke-dasharray="3 4"/>
<rect x="20" y="160" width="160" height="62" rx="6" fill="#fdf8ee" stroke="#999999" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="100.0" y="182" text-anchor="middle" font-size="12.5" font-weight="600">Part 4</text>
<text x="100.0" y="200" text-anchor="middle" font-size="11" fill="#555555">24 elements are silent</text>
<rect x="198" y="56" width="160" height="62" rx="6" fill="#f7f9fc" stroke="#2c6cb0" stroke-width="1.5"/><text x="278.0" y="83.0" text-anchor="middle" font-size="12.5" font-weight="600">The fold</text><text x="278.0" y="100.0" text-anchor="middle" font-size="11.5" fill="#555555">121 into 36</text>
<line x1="180" y1="87" x2="198" y2="87" stroke="#555555" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="278.0" y1="118" x2="278.0" y2="160" stroke="#999999" stroke-width="1.3" stroke-dasharray="3 4"/>
<rect x="198" y="160" width="160" height="62" rx="6" fill="#fdf8ee" stroke="#999999" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="278.0" y="182" text-anchor="middle" font-size="12.5" font-weight="600">Part 4</text>
<text x="278.0" y="200" text-anchor="middle" font-size="11" fill="#555555">inside the Cyclone, no way in</text>
<rect x="376" y="56" width="160" height="62" rx="6" fill="#f7f9fc" stroke="#2c6cb0" stroke-width="1.5"/><text x="456.0" y="83.0" text-anchor="middle" font-size="12.5" font-weight="600">SHARC channel order</text><text x="456.0" y="100.0" text-anchor="middle" font-size="11.5" fill="#555555">DSP rings</text>
<line x1="358" y1="87" x2="376" y2="87" stroke="#555555" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="456.0" y1="118" x2="456.0" y2="160" stroke="#999999" stroke-width="1.3" stroke-dasharray="3 4"/>
<rect x="376" y="160" width="160" height="62" rx="6" fill="#fdf8ee" stroke="#999999" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="456.0" y="182" text-anchor="middle" font-size="12.5" font-weight="600">Parts 5, 6</text>
<text x="456.0" y="200" text-anchor="middle" font-size="11" fill="#555555">load DSPs, read a ring</text>
<rect x="554" y="56" width="160" height="62" rx="6" fill="#f7f9fc" stroke="#2c6cb0" stroke-width="1.5"/><text x="634.0" y="83.0" text-anchor="middle" font-size="12.5" font-weight="600">FPGA route</text><text x="634.0" y="100.0" text-anchor="middle" font-size="11.5" fill="#555555">register window</text>
<line x1="536" y1="87" x2="554" y2="87" stroke="#555555" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="634.0" y1="118" x2="634.0" y2="160" stroke="#999999" stroke-width="1.3" stroke-dasharray="3 4"/>
<rect x="554" y="160" width="160" height="62" rx="6" fill="#fdf8ee" stroke="#999999" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="634.0" y="182" text-anchor="middle" font-size="12.5" font-weight="600">Part 4</text>
<text x="634.0" y="200" text-anchor="middle" font-size="11" fill="#555555">sixteen register banks</text>
<rect x="732" y="56" width="160" height="62" rx="6" fill="#f7f9fc" stroke="#2c6cb0" stroke-width="1.5"/><text x="812.0" y="83.0" text-anchor="middle" font-size="12.5" font-weight="600">Dante mapping</text><text x="812.0" y="100.0" text-anchor="middle" font-size="11.5" fill="#555555">8 channels out</text>
<line x1="714" y1="87" x2="732" y2="87" stroke="#555555" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="812.0" y1="118" x2="812.0" y2="160" stroke="#999999" stroke-width="1.3" stroke-dasharray="3 4"/>
<rect x="732" y="160" width="160" height="62" rx="6" fill="#fdf8ee" stroke="#999999" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="812.0" y="182" text-anchor="middle" font-size="12.5" font-weight="600">Part 7</text>
<text x="812.0" y="200" text-anchor="middle" font-size="11" fill="#555555">what is on the 8 channels</text>
<rect x="910" y="56" width="160" height="62" rx="6" fill="#f7f9fc" stroke="#2c6cb0" stroke-width="1.5"/><text x="990.0" y="83.0" text-anchor="middle" font-size="12.5" font-weight="600">My code on the PC</text><text x="990.0" y="100.0" text-anchor="middle" font-size="11.5" fill="#555555">hub and bearing</text>
<line x1="892" y1="87" x2="910" y2="87" stroke="#555555" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="990.0" y1="118" x2="990.0" y2="160" stroke="#999999" stroke-width="1.3" stroke-dasharray="3 4"/>
<rect x="910" y="160" width="160" height="62" rx="6" fill="#fdf8ee" stroke="#999999" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="990.0" y="182" text-anchor="middle" font-size="12.5" font-weight="600">Parts 8, 9</text>
<text x="990.0" y="200" text-anchor="middle" font-size="11" fill="#555555">bearings, hub, dashboard</text>
<rect x="20" y="246" width="1050" height="56" rx="6" fill="#f7f9fc" stroke="#999999" stroke-width="1.5"/><text x="36" y="267" text-anchor="start" font-size="11.5" fill="#1a1a1a">A wrong bearing could be any of these. The series is about getting a probe between two of them</text><text x="36" y="284" text-anchor="start" font-size="11.5" fill="#1a1a1a">on hardware built as a sealed appliance.</text>
</svg>
