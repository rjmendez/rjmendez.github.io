<svg xmlns="http://www.w3.org/2000/svg" width="1090" height="340" viewBox="0 0 1090 340" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="13" fill="#f2f2f2">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9c9c9"/></marker></defs>
<text x="20" y="22" font-weight="600" font-size="14">Following at the edge: fast reflex first, the hub names it later</text>
<rect x="20" y="44" width="155" height="56" rx="6" fill="#3b3f45" stroke="#8a8a8a" stroke-width="1.5"/><text x="97.5" y="68.0" text-anchor="middle" font-size="12.5" font-weight="600">Any sound</text><text x="97.5" y="85.0" text-anchor="middle" font-size="11.5" fill="#c9c9c9">cars, drones, birds, voices</text>
<text x="97.5" y="118" text-anchor="middle" font-size="10.5" fill="#c9c9c9">the array hears it</text>
<rect x="197" y="44" width="155" height="56" rx="6" fill="#3b3f45" stroke="#7cb6ff" stroke-width="1.5"/><text x="274.5" y="68.0" text-anchor="middle" font-size="12.5" font-weight="600">Ants</text><text x="274.5" y="85.0" text-anchor="middle" font-size="11.5" fill="#c9c9c9">features and flags</text>
<text x="274.5" y="118" text-anchor="middle" font-size="10.5" fill="#c9c9c9">simulation</text>
<line x1="175" y1="72" x2="197" y2="72" stroke="#c9c9c9" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="374" y="44" width="155" height="56" rx="6" fill="#3b3f45" stroke="#9a9a9a" stroke-width="1.5" stroke-dasharray="5 4"/><text x="451.5" y="68.0" text-anchor="middle" font-size="12.5" font-weight="600">Follow</text><text x="451.5" y="85.0" text-anchor="middle" font-size="11.5" fill="#c9c9c9">bearing hint, beam steer</text>
<text x="451.5" y="118" text-anchor="middle" font-size="10.5" fill="#c9c9c9">design</text>
<line x1="352" y1="72" x2="374" y2="72" stroke="#c9c9c9" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="551" y="44" width="155" height="56" rx="6" fill="#3b3f45" stroke="#9a9a9a" stroke-width="1.5" stroke-dasharray="5 4"/><text x="628.5" y="68.0" text-anchor="middle" font-size="12.5" font-weight="600">Features ride along</text><text x="628.5" y="85.0" text-anchor="middle" font-size="11.5" fill="#c9c9c9">bands or an embedding</text>
<text x="628.5" y="118" text-anchor="middle" font-size="10.5" fill="#c9c9c9">design</text>
<line x1="529" y1="72" x2="551" y2="72" stroke="#c9c9c9" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="728" y="44" width="155" height="56" rx="6" fill="#3b3f45" stroke="#9a9a9a" stroke-width="1.5" stroke-dasharray="5 4"/><text x="805.5" y="68.0" text-anchor="middle" font-size="12.5" font-weight="600">Zynq filter</text><text x="805.5" y="85.0" text-anchor="middle" font-size="11.5" fill="#c9c9c9">drops stale or false</text>
<text x="805.5" y="118" text-anchor="middle" font-size="10.5" fill="#c9c9c9">design</text>
<line x1="706" y1="72" x2="728" y2="72" stroke="#c9c9c9" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="905" y="44" width="155" height="56" rx="6" fill="#3b3f45" stroke="#8a8a8a" stroke-width="1.5"/><text x="982.5" y="68.0" text-anchor="middle" font-size="12.5" font-weight="600">Hub names it</text><text x="982.5" y="85.0" text-anchor="middle" font-size="11.5" fill="#c9c9c9">BirdNET, Perch</text>
<text x="982.5" y="118" text-anchor="middle" font-size="10.5" fill="#c9c9c9">runs today</text>
<line x1="883" y1="72" x2="905" y2="72" stroke="#c9c9c9" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="20" y="150" width="340" height="86" rx="6" fill="#3b3f45" stroke="#9a9a9a" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="32" y="171" font-size="12.5" font-weight="600">Measure the reflex</text>
<text x="32" y="191" text-anchor="start" font-size="11" fill="#c9c9c9">First sound to beam steer, impulse</text><text x="32" y="206" text-anchor="start" font-size="11" fill="#c9c9c9">recall and false triggers, on real</text><text x="32" y="221" text-anchor="start" font-size="11" fill="#c9c9c9">audio. None measured yet.</text>
<rect x="375" y="150" width="340" height="86" rx="6" fill="#3b3f45" stroke="#9a9a9a" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="387" y="171" font-size="12.5" font-weight="600">Windows that fit impulses</text>
<text x="387" y="191" text-anchor="start" font-size="11" fill="#c9c9c9">A 21 ms window and two flagged</text><text x="387" y="206" text-anchor="start" font-size="11" fill="#c9c9c9">windows can miss one chirp or click.</text><text x="387" y="221" text-anchor="start" font-size="11" fill="#c9c9c9">Try a shorter path for impulses.</text>
<rect x="730" y="150" width="340" height="86" rx="6" fill="#3b3f45" stroke="#9a9a9a" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="742" y="171" font-size="12.5" font-weight="600">Wire the flag to an actor</text>
<text x="742" y="191" text-anchor="start" font-size="11" fill="#c9c9c9">The activity gate flag is read out,</text><text x="742" y="206" text-anchor="start" font-size="11" fill="#c9c9c9">not connected to anything.</text><text x="742" y="221" text-anchor="start" font-size="11" fill="#c9c9c9">Connect it to a steer request.</text>
<rect x="20" y="248" width="340" height="86" rx="6" fill="#3b3f45" stroke="#9a9a9a" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="32" y="269" font-size="12.5" font-weight="600">Pick what rides along</text>
<text x="32" y="289" text-anchor="start" font-size="11" fill="#c9c9c9">Ant code, mel-style bands or a</text><text x="32" y="304" text-anchor="start" font-size="11" fill="#c9c9c9">learned embedding. Judge each by</text><text x="32" y="319" text-anchor="start" font-size="11" fill="#c9c9c9">whether the hub does better with it.</text>
<rect x="375" y="248" width="340" height="86" rx="6" fill="#3b3f45" stroke="#9a9a9a" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="387" y="269" font-size="12.5" font-weight="600">False triggers are cheap</text>
<text x="387" y="289" text-anchor="start" font-size="11" fill="#c9c9c9">Wrong reflexes cost a beam move.</text><text x="387" y="304" text-anchor="start" font-size="11" fill="#c9c9c9">The Zynq and hub filter them, so</text><text x="387" y="319" text-anchor="start" font-size="11" fill="#c9c9c9">tune the ant for speed.</text>
<rect x="730" y="248" width="340" height="86" rx="6" fill="#3b3f45" stroke="#9a9a9a" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="742" y="269" font-size="12.5" font-weight="600">Several sources at once</text>
<text x="742" y="289" text-anchor="start" font-size="11" fill="#c9c9c9">Different ants on different beams</text><text x="742" y="304" text-anchor="start" font-size="11" fill="#c9c9c9">can hold different sources. The</text><text x="742" y="319" text-anchor="start" font-size="11" fill="#c9c9c9">tracker decides who is who.</text>
</svg>
