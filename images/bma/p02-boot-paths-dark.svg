<svg xmlns="http://www.w3.org/2000/svg" width="1090" height="290" viewBox="0 0 1090 290" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="13" fill="#f2f2f2">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9c9c9"/></marker></defs>
<text x="20" y="22" font-weight="600" font-size="14">Three ways to run a kernel on the tile, from least to most permanent</text>
<rect x="20" y="44" width="338" height="160" rx="6" fill="#3b3f45" stroke="#86d98f" stroke-width="1.5"/><text x="189.0" y="66" text-anchor="middle" font-size="13" font-weight="600">1. NFS root from the bench</text>
<text x="189" y="84" text-anchor="middle" font-size="11.5" fill="#c9c9c9">interrupt U-Boot, point the kernel</text><text x="189" y="102" text-anchor="middle" font-size="11.5" fill="#c9c9c9">at an NFS root, boot</text><text x="189" y="120" text-anchor="middle" font-size="11.5" fill="#c9c9c9"></text><text x="189" y="138" text-anchor="middle" font-size="11.5" fill="#c9c9c9">flash is not written</text><text x="189" y="156" text-anchor="middle" font-size="11.5" fill="#c9c9c9">a power cycle restores stock</text>
<rect x="376" y="44" width="338" height="160" rx="6" fill="#3b3f45" stroke="#7cb6ff" stroke-width="1.5"/><text x="545.0" y="66" text-anchor="middle" font-size="13" font-weight="600">2. Primary NAND slot, 0x200000</text>
<text x="545" y="84" text-anchor="middle" font-size="11.5" fill="#c9c9c9">save the stock kernel first, through</text><text x="545" y="102" text-anchor="middle" font-size="11.5" fill="#c9c9c9">the MTD char node so ECC applies</text><text x="545" y="120" text-anchor="middle" font-size="11.5" fill="#c9c9c9">erase and write the primary slot</text><text x="545" y="138" text-anchor="middle" font-size="11.5" fill="#c9c9c9">update imagesize if the size changed</text><text x="545" y="156" text-anchor="middle" font-size="11.5" fill="#c9c9c9">test over TFTP before writing</text>
<rect x="732" y="44" width="338" height="160" rx="6" fill="#3b3f45" stroke="#9a9a9a" stroke-width="1.5" stroke-dasharray="5 4"/><text x="901.0" y="66" text-anchor="middle" font-size="13" font-weight="600">3. The safe slot, 0x4220000</text>
<text x="901" y="84" text-anchor="middle" font-size="11.5" fill="#c9c9c9">never touched</text><text x="901" y="102" text-anchor="middle" font-size="11.5" fill="#c9c9c9">bootcmd tries normal, then safe</text><text x="901" y="120" text-anchor="middle" font-size="11.5" fill="#c9c9c9"></text><text x="901" y="138" text-anchor="middle" font-size="11.5" fill="#c9c9c9">but a kernel that hangs after</text><text x="901" y="156" text-anchor="middle" font-size="11.5" fill="#c9c9c9">a good bootm does not fall through</text>
<rect x="20" y="224" width="1050" height="56" rx="6" fill="#3b3f45" stroke="#9a9a9a" stroke-width="1.5"/><text x="36" y="245" text-anchor="start" font-size="11.5" fill="#f2f2f2">Check the minor number before you trust a dump. MTD char nodes use minor 2N for partition N.</text><text x="36" y="262" text-anchor="start" font-size="11.5" fill="#f2f2f2">A /dev/mtd4 made with minor 4 opens mtd2, the blank U-Boot partition, and dd copies 512 KiB of 0xFF without an error.</text>
</svg>
