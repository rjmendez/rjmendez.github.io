<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .lbl{fill:#1a1a1a;font-size:14px}
    .sm{fill:#555;font-size:12px}
    .ttl{fill:#1a1a1a;font-size:18px;font-weight:600}
    .tile{fill:#f4f4f4;stroke:#1a1a1a;stroke-width:1.4}
    .ray{stroke:#2e6da4;stroke-width:2;fill:none}
    .arc{stroke:#2e6da4;stroke-width:1.2;fill:none}
    .track{stroke:#9aa0a6;stroke-width:1.5;stroke-dasharray:5 5;fill:none}
    .bird{fill:#c0392b;stroke:#7b241c;stroke-width:1.2}
  </style>

  <text class="ttl" x="30" y="36">Bearings to a fix</text>
  <text class="sm" x="30" y="58">Top-down view. One bearing per tile; bearings cross at the source.</text>

  <!-- yard frame -->
  <rect x="60" y="80" width="780" height="360" fill="#fcfcfc" stroke="#d0d0d0"/>

  <!-- tiles -->
  <g>
    <rect class="tile" x="112" y="392" width="34" height="34" rx="3"/>
    <text class="sm" x="96" y="388">tile A</text>
    <rect class="tile" x="754" y="392" width="34" height="34" rx="3"/>
    <text class="sm" x="742" y="388">tile B</text>
    <rect class="tile" x="433" y="96" width="34" height="34" rx="3"/>
    <text class="sm" x="474" y="118">tile C</text>
  </g>

  <!-- the source (bird) -->
  <g>
    <circle class="bird" cx="470" cy="300" r="7"/>
    <text class="lbl" x="484" y="305">source</text>
  </g>

  <!-- bearing rays, each from a tile centre toward the source, extended past it -->
  <line x1="129" y1="409" x2="560" y2="262" class="ray" marker-end="url(#rh)"/>
  <line x1="771" y1="409" x2="398" y2="275" class="ray" marker-end="url(#rh)"/>
  <line x1="450" y1="130" x2="476" y2="360" class="ray" marker-end="url(#rh)"/>

  <!-- small bearing-angle arcs at each tile -->
  <path class="arc" d="M129 389 a20 20 0 0 1 18 6"/>
  <text class="sm" x="150" y="384">&#952;&#8320;</text>
  <path class="arc" d="M771 389 a20 20 0 0 0 -18 6"/>
  <text class="sm" x="724" y="384">&#952;&#8321;</text>
  <path class="arc" d="M470 130 a20 20 0 0 1 4 20"/>
  <text class="sm" x="476" y="156">&#952;&#8322;</text>

  <!-- fix emphasis -->
  <circle cx="470" cy="300" r="20" fill="none" stroke="#c0392b" stroke-width="1" stroke-dasharray="3 3"/>
  <text class="sm" x="492" y="384">bearings intersect &#8594; one fix</text>

  <!-- track over time -->
  <path class="track" d="M300 430 q60 -120 170 -130 q120 -8 200 -70"/>
  <text class="sm" x="300" y="452">dashed: successive fixes &#8594; a track</text>

  <!-- per-tile inset: where a bearing comes from -->
  <text class="sm" x="70" y="474">bearing = look angle with the most beam power (delay-and-sum beam swept across directions)</text>

  <!-- SIMULATED tag -->
  <rect x="640" y="22" width="230" height="30" rx="4" fill="#fbf3f2" stroke="#c0392b"/>
  <text x="655" y="42" fill="#a5281b" font-size="13" font-weight="600">SIMULATED: generated signals</text>

<defs>
    <marker id="rh" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#2e6da4"/></marker>
  </defs>
</svg>
