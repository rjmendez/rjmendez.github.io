<svg xmlns="http://www.w3.org/2000/svg" width="1090" height="406" viewBox="0 0 1090 406" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="13" fill="#1a1a1a">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker></defs>
<text x="20" y="22" font-weight="600" font-size="14">Why rewriting the Cyclone is out of scope for now</text>
<rect x="20" y="44" width="338" height="130" rx="6" fill="#f7f9fc" stroke="#2c6cb0" stroke-width="1.5"/><text x="189.0" y="66" text-anchor="middle" font-size="13" font-weight="600">Power on</text>
<text x="189" y="82" text-anchor="middle" font-size="11.5" fill="#555555">Cyclone V reads its own SPI flash</text><text x="189" y="99" text-anchor="middle" font-size="11.5" fill="#555555">(Active Serial)</text><text x="189" y="116" text-anchor="middle" font-size="11.5" fill="#555555">Linux is not involved</text>
<rect x="376" y="44" width="338" height="130" rx="6" fill="#f7f9fc" stroke="#999999" stroke-width="1.5" stroke-dasharray="5 4"/><text x="545.0" y="66" text-anchor="middle" font-size="13" font-weight="600">Update</text>
<text x="545" y="82" text-anchor="middle" font-size="11.5" fill="#555555">fpgaupdate writes the SPI flash</text><text x="545" y="99" text-anchor="middle" font-size="11.5" fill="#555555">then reads it back</text><text x="545" y="116" text-anchor="middle" font-size="11.5" fill="#555555">3-wire bit-bang shifter, no TMS:</text><text x="545" y="133" text-anchor="middle" font-size="11.5" fill="#555555">not a JTAG port</text>
<rect x="732" y="44" width="338" height="130" rx="6" fill="#f7f9fc" stroke="#2e7d32" stroke-width="1.5"/><text x="901.0" y="66" text-anchor="middle" font-size="13" font-weight="600">Verify, read-only</text>
<text x="901" y="82" text-anchor="middle" font-size="11.5" fill="#555555">read register 0x64000022</text><text x="901" y="99" text-anchor="middle" font-size="11.5" fill="#555555">shows which bitstream is running,</text><text x="901" y="116" text-anchor="middle" font-size="11.5" fill="#555555">not what is in flash</text>
<rect x="20" y="200" width="510" height="130" rx="6" fill="#fdf8ee" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5 4"/><text x="275.0" y="222" text-anchor="middle" font-size="13" font-weight="600">Blocker 1: the update path is unsafe</text>
<text x="275" y="240" text-anchor="middle" font-size="11.5" fill="#555555">on a long-uptime board the driver asked the kernel</text><text x="275" y="257" text-anchor="middle" font-size="11.5" fill="#555555">for an order-10 allocation: 4 MiB of contiguous memory</text><text x="275" y="274" text-anchor="middle" font-size="11.5" fill="#555555">it failed, and the process stayed in D state</text><text x="275" y="291" text-anchor="middle" font-size="11.5" fill="#555555">until a power cycle</text><text x="275" y="308" text-anchor="middle" font-size="11.5" fill="#555555">reproducible</text>
<rect x="560" y="200" width="510" height="130" rx="6" fill="#fdf8ee" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5 4"/><text x="815.0" y="222" text-anchor="middle" font-size="13" font-weight="600">Blocker 2: the bitstream is opaque</text>
<text x="815" y="240" text-anchor="middle" font-size="11.5" fill="#555555">vendor ASCII container, CRC-16/ARC checks out</text><text x="815" y="257" text-anchor="middle" font-size="11.5" fill="#555555">payload is not a Xilinx or stock Quartus image</text><text x="815" y="274" text-anchor="middle" font-size="11.5" fill="#555555">no sync word</text><text x="815" y="291" text-anchor="middle" font-size="11.5" fill="#555555">about 6.6 bits per byte, so not encrypted</text><text x="815" y="308" text-anchor="middle" font-size="11.5" fill="#555555">cannot round-trip the format yet</text>
<rect x="20" y="350" width="1050" height="39" rx="6" fill="#f7f9fc" stroke="#999999" stroke-width="1.5"/><text x="36" y="371" text-anchor="start" font-size="11.5" fill="#1a1a1a">The fabric stays as it is. My own egress has to go through the Zynq side.</text>
</svg>
