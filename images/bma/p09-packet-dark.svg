<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="270" viewBox="0 0 1000 270" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="13" fill="#f2f2f2">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9c9c9"/></marker></defs>
<text x="20" y="22" font-weight="600" font-size="14">One 393-byte media packet, 8 channels</text>
<text x="980" y="22" text-anchor="end" font-size="12" fill="#c9c9c9">not to scale: frames 2..14 collapsed</text>
<rect x="20" y="46" width="46" height="44" fill="#3b3f45" stroke="#ff8a7a" stroke-width="1.6"/>
<text x="43.0" y="66" text-anchor="middle" font-weight="600" font-size="12.5">0x02</text>
<text x="43.0" y="82" text-anchor="middle" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="11" fill="#c9c9c9">0</text>
<rect x="66" y="46" width="112" height="44" fill="#3b3f45" stroke="#f0c24b" stroke-width="1.6"/>
<text x="122.0" y="66" text-anchor="middle" font-weight="600" font-size="12.5">seconds</text>
<text x="122.0" y="82" text-anchor="middle" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="11" fill="#c9c9c9">1..4</text>
<rect x="178" y="46" width="132" height="44" fill="#3b3f45" stroke="#f0c24b" stroke-width="1.6"/>
<text x="244.0" y="66" text-anchor="middle" font-weight="600" font-size="12.5">frame in second</text>
<text x="244.0" y="82" text-anchor="middle" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="11" fill="#c9c9c9">5..8</text>
<rect x="310" y="46" width="118" height="44" fill="#3b3f45" stroke="#7cb6ff" stroke-width="1.6"/>
<text x="369.0" y="66" text-anchor="middle" font-weight="600" font-size="12.5">frame 0</text>
<text x="369.0" y="82" text-anchor="middle" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="11" fill="#c9c9c9">9..32</text>
<rect x="428" y="46" width="118" height="44" fill="#3b3f45" stroke="#7cb6ff" stroke-width="1.6"/>
<text x="487.0" y="66" text-anchor="middle" font-weight="600" font-size="12.5">frame 1</text>
<text x="487.0" y="82" text-anchor="middle" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="11" fill="#c9c9c9">33..56</text>
<rect x="546" y="46" width="316" height="44" fill="#3b3f45" stroke="#9a9a9a" stroke-width="1.6"/>
<text x="704.0" y="66" text-anchor="middle" font-weight="600" font-size="12.5">frames 2..14</text>
<text x="704.0" y="82" text-anchor="middle" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="11" fill="#c9c9c9">57..368</text>
<rect x="862" y="46" width="118" height="44" fill="#3b3f45" stroke="#7cb6ff" stroke-width="1.6"/>
<text x="921.0" y="66" text-anchor="middle" font-weight="600" font-size="12.5">frame 15</text>
<text x="921.0" y="82" text-anchor="middle" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="11" fill="#c9c9c9">369..392</text>
<text x="20" y="108" font-size="11.5" fill="#c9c9c9">9-byte header, big-endian; first sample index = seconds × 48000 + frame (frame &lt; 48000)</text>
<path d="M310,116 L20,154 M428,116 L980,154" stroke="#9a9a9a" stroke-dasharray="3 3" fill="none"/>
<rect x="20.0" y="154" width="120.0" height="52" fill="#45403a" stroke="#7cb6ff" stroke-width="1.2"/>
<text x="80.0" y="175" text-anchor="middle" font-weight="600">ch 0</text>
<text x="80.0" y="194" text-anchor="middle" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="11" fill="#c9c9c9">bytes 9..11</text>
<rect x="140.0" y="154" width="120.0" height="52" fill="#45403a" stroke="#7cb6ff" stroke-width="1.2"/>
<text x="200.0" y="175" text-anchor="middle" font-weight="600">ch 1</text>
<text x="200.0" y="194" text-anchor="middle" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="11" fill="#c9c9c9">bytes 12..14</text>
<rect x="260.0" y="154" width="120.0" height="52" fill="#45403a" stroke="#7cb6ff" stroke-width="1.2"/>
<text x="320.0" y="175" text-anchor="middle" font-weight="600">ch 2</text>
<text x="320.0" y="194" text-anchor="middle" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="11" fill="#c9c9c9">bytes 15..17</text>
<rect x="380.0" y="154" width="120.0" height="52" fill="#45403a" stroke="#7cb6ff" stroke-width="1.2"/>
<text x="440.0" y="175" text-anchor="middle" font-weight="600">ch 3</text>
<text x="440.0" y="194" text-anchor="middle" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="11" fill="#c9c9c9">bytes 18..20</text>
<rect x="500.0" y="154" width="120.0" height="52" fill="#45403a" stroke="#7cb6ff" stroke-width="1.2"/>
<text x="560.0" y="175" text-anchor="middle" font-weight="600">ch 4</text>
<text x="560.0" y="194" text-anchor="middle" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="11" fill="#c9c9c9">bytes 21..23</text>
<rect x="620.0" y="154" width="120.0" height="52" fill="#45403a" stroke="#7cb6ff" stroke-width="1.2"/>
<text x="680.0" y="175" text-anchor="middle" font-weight="600">ch 5</text>
<text x="680.0" y="194" text-anchor="middle" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="11" fill="#c9c9c9">bytes 24..26</text>
<rect x="740.0" y="154" width="120.0" height="52" fill="#45403a" stroke="#7cb6ff" stroke-width="1.2"/>
<text x="800.0" y="175" text-anchor="middle" font-weight="600">ch 6</text>
<text x="800.0" y="194" text-anchor="middle" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="11" fill="#c9c9c9">bytes 27..29</text>
<rect x="860.0" y="154" width="120.0" height="52" fill="#45403a" stroke="#7cb6ff" stroke-width="1.2"/>
<text x="920.0" y="175" text-anchor="middle" font-weight="600">ch 7</text>
<text x="920.0" y="194" text-anchor="middle" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="11" fill="#c9c9c9">bytes 30..32</text>
<text x="20" y="228" font-size="12.5">Each sample: signed 24-bit big-endian. Frame f, channel c starts at byte <tspan font-family="Consolas, DejaVu Sans Mono, monospace">9 + 3·(8f + c)</tspan>.</text>
<text x="20" y="250" font-size="12.5">3,000 packets/s × 16 frames = 48 kHz;  1,152,000 PCM bytes/s per tile;  next packet starts 16 samples later.</text>
</svg>
