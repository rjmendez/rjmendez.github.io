<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="420" viewBox="0 0 1060 420" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="13" fill="#1a1a1a">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker></defs>
<text x="20" y="22" font-weight="600" font-size="14">One ant: a beam in, a 64-bit code and a class out</text>
<text x="20" y="40" font-size="12" fill="#555555">integer only, no multiplier or divider in the encoder; RTL bit-exact with the reference in simulation, not on a board</text>
<rect x="20" y="58" width="178" height="60" rx="6" fill="#f7f9fc" stroke="#9a9a9a" stroke-width="1.5"/><text x="109.0" y="84.0" text-anchor="middle" font-size="13" font-weight="600">one beam</text><text x="109.0" y="101.0" text-anchor="middle" font-size="11.5" fill="#555555">24-bit PCM, 48 kHz</text>
<line x1="198" y1="88" x2="218" y2="88" stroke="#555555" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="220" y="58" width="178" height="60" rx="6" fill="#f7f9fc" stroke="#2c6cb0" stroke-width="1.5"/><text x="309.0" y="84.0" text-anchor="middle" font-size="13" font-weight="600">one-pole split</text><text x="309.0" y="101.0" text-anchor="middle" font-size="11.5" fill="#555555">low (&lt; ~477 Hz) + rest</text>
<line x1="398" y1="88" x2="418" y2="88" stroke="#555555" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="420" y="58" width="178" height="60" rx="6" fill="#f7f9fc" stroke="#2c6cb0" stroke-width="1.5"/><text x="509.0" y="84.0" text-anchor="middle" font-size="13" font-weight="600">1024-sample window</text><text x="509.0" y="101.0" text-anchor="middle" font-size="11.5" fill="#555555">Σ|low|, Σ|rest|, crossings</text>
<line x1="598" y1="88" x2="618" y2="88" stroke="#555555" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="620" y="58" width="178" height="60" rx="6" fill="#f7f9fc" stroke="#2c6cb0" stroke-width="1.5"/><text x="709.0" y="84.0" text-anchor="middle" font-size="13" font-weight="600">log2, ~1.5 dB steps</text><text x="709.0" y="101.0" text-anchor="middle" font-size="11.5" fill="#555555">shift + 2 mantissa bits</text>
<line x1="798" y1="88" x2="818" y2="88" stroke="#555555" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="820" y="58" width="178" height="60" rx="6" fill="#f7f9fc" stroke="#2c6cb0" stroke-width="1.5"/><text x="909.0" y="84.0" text-anchor="middle" font-size="13" font-weight="600">noise floors</text><text x="909.0" y="101.0" text-anchor="middle" font-size="11.5" fill="#555555">drop at once, rise slowly</text>
<path d="M909.0,118 L909.0,134 L120,134 L120,146" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="20" y="150" width="200" height="60" rx="6" fill="#f7f9fc" stroke="#b8860b" stroke-width="1.5"/><text x="120.0" y="176.0" text-anchor="middle" font-size="13" font-weight="600">64-bit code</text><text x="120.0" y="193.0" text-anchor="middle" font-size="11.5" fill="#555555">4 fields, 8-12 hot bits</text>
<line x1="220" y1="180" x2="256" y2="180" stroke="#555555" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="258" y="150" width="210" height="60" rx="6" fill="#f7f9fc" stroke="#2e7d32" stroke-width="1.5"/><text x="363.0" y="176.0" text-anchor="middle" font-size="13" font-weight="600">head: MB or linear</text><text x="363.0" y="193.0" text-anchor="middle" font-size="11.5" fill="#555555">int8 weights from the host</text>
<line x1="468" y1="180" x2="504" y2="180" stroke="#555555" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="506" y="150" width="200" height="60" rx="6" fill="#f7f9fc" stroke="#2e7d32" stroke-width="1.5"/><text x="606.0" y="176.0" text-anchor="middle" font-size="13" font-weight="600">result register</text><text x="606.0" y="193.0" text-anchor="middle" font-size="11.5" fill="#555555">class, 3 scores, sequence</text>
<text x="730" y="168" font-size="11.5" fill="#555555">code ready 104 clocks after the window ends</text>
<text x="730" y="185" font-size="11.5" fill="#555555">MB inference: 1,803 clocks (256 cells)</text>
<text x="730" y="202" font-size="11.5" fill="#555555">a window at the real sample rate: 524,288 clocks</text>
<text x="20" y="252" font-weight="600">One code, from the 3 kHz tone (window 58 of the stream below)</text>
