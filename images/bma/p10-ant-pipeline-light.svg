<path d="M600,308 L600,314 L934,314 L934,308" fill="none" stroke="#2c6cb0" stroke-width="1.5"/>
<text x="767.0" y="330" text-anchor="middle" font-size="12" font-weight="600" fill="#2c6cb0">band ratio</text>
<text x="767.0" y="346" text-anchor="middle" font-size="11.5" fill="#555555">high − low = 10 steps</text>
<path d="M432,308 L432,314 L598,314 L598,308" fill="none" stroke="#2e7d32" stroke-width="1.5"/>
<text x="515.0" y="330" text-anchor="middle" font-size="12" font-weight="600" fill="#2e7d32">low band above floor</text>
<text x="515.0" y="346" text-anchor="middle" font-size="11.5" fill="#555555">9 steps</text>
<path d="M264,308 L264,314 L430,314 L430,308" fill="none" stroke="#2f7f93" stroke-width="1.5"/>
<text x="347.0" y="330" text-anchor="middle" font-size="12" font-weight="600" fill="#2f7f93">high band above floor</text>
<text x="347.0" y="346" text-anchor="middle" font-size="11.5" fill="#555555">20 steps (cap 20)</text>
<path d="M40,308 L40,314 L262,314 L262,308" fill="none" stroke="#7b3fa0" stroke-width="1.5"/>
<text x="151.0" y="330" text-anchor="middle" font-size="12" font-weight="600" fill="#7b3fa0">zero-crossing rate</text>
<text x="151.0" y="346" text-anchor="middle" font-size="11.5" fill="#555555">128 per window</text>
<text x="950" y="291" font-size="11.5" fill="#555555">bit 0</text>
<text x="32" y="296" text-anchor="end" font-size="11.5" fill="#555555">63</text>
<text x="20" y="374" font-size="12">Each field is a "bump" of 2-3 adjacent hot bits, so nearby values share bits and none of the 64 is stuck on or off. The ratio and crossing fields</text>
<text x="20" y="391" font-size="12">ignore overall loudness (the same tone 12 dB up: same crossings, ratio one step off); the two above-floor fields carry the level.</text>
