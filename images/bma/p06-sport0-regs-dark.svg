<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 376" font-family="Segoe UI, Arial, sans-serif">
<style>.t{font-size:17px;font-weight:600;fill:#f2f2f2} .l{font-size:13px;fill:#f2f2f2}
.m{font-family:Consolas,monospace;font-size:13px;fill:#c9c9c9} .mv{font-family:Consolas,monospace;font-size:13px;font-weight:700;fill:#f2f2f2}
.s{font-size:11.5px;fill:#c9c9c9}</style>
<text x="20" y="30" class="t">DSP4's SPORT0, read from the inside</text>
<text x="20" y="50" class="s">copied into data memory by a one-shot hook in the ISR, then read over SPI. Only DSP4 loaded, 2026-11-16.</text>
<rect x="20" y="62" width="860" height="27" fill="#3b3f45"/><text x="32" y="80" class="m">SPORT0_CTL_A</text><text x="230" y="80" class="mv">c2000171</text><text x="400" y="80" class="l">SPTRAN set: half A transmits. SLEN 23: 24-bit words</text><rect x="20" y="89" width="860" height="27" fill="none"/><text x="32" y="107" class="m">SPORT0_CTL_B</text><text x="230" y="107" class="mv">00000171</text><text x="400" y="107" class="l">half B receives, same word length</text><rect x="20" y="116" width="860" height="27" fill="#3b3f45"/><text x="32" y="134" class="m">SPORT0_MCTL_A/B</text><text x="230" y="134" class="mv">00001401</text><text x="400" y="134" class="l">multichannel on, WSIZE 20: a 21-slot window</text><rect x="20" y="143" width="860" height="27" fill="#45403a" stroke="#ff8a7a" stroke-width="1.4"/><text x="32" y="161" class="m">SPORT0_CS0_A/B</text><text x="230" y="161" class="mv" fill="#ff8a7a">00000001</text><text x="400" y="161" class="l">only slot 0 of the window is enabled</text><rect x="20" y="170" width="860" height="27" fill="#3b3f45"/><text x="32" y="188" class="m">SPORT0_CS1..3</text><text x="230" y="188" class="mv">00000000</text><text x="400" y="188" class="l">nothing above slot 31</text><rect x="20" y="197" width="860" height="27" fill="none"/><text x="32" y="215" class="m">SPORT0_DIV_A/B</text><text x="230" y="215" class="mv">00170020</text><text x="400" y="215" class="l">clock and frame sync come from outside</text><rect x="20" y="224" width="860" height="27" fill="#3b3f45"/><text x="32" y="242" class="m">DMA0 ADDRSTART</text><text x="230" y="242" class="mv">28256dc8</text><text x="400" y="242" class="l">0x256dc8, one of the three ring buffers</text><rect x="20" y="251" width="860" height="27" fill="none"/><text x="32" y="269" class="m">DMA1 ADDRSTART</text><text x="230" y="269" class="mv">28257308</text><text x="400" y="269" class="l">0x257308, another one</text><rect x="20" y="278" width="860" height="27" fill="#3b3f45"/><text x="32" y="296" class="m">DMA0/1 XCNT, XMOD</text><text x="230" y="296" class="mv">000000a8, 4</text><text x="400" y="296" class="l">168 words of 4 bytes = 8 frames x 21</text><rect x="20" y="305" width="860" height="27" fill="none"/><text x="32" y="323" class="m">DMA0 / DMA1 CFG</text><text x="230" y="323" class="mv">00114221 / 23</text><text x="400" y="323" class="l">DMA1 writes memory, DMA0 reads it</text>
<text x="20" y="360" class="s">Decode from the ADSP-2156x hardware reference. A nine-DSP reload sets CS0 back to 0x00000001.</text>
</svg>