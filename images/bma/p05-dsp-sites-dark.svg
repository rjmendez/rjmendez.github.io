<path d="M20 158 v8 h82 v-8" fill="none" stroke="#c9a0ff" stroke-width="1.3"/><text x="20" y="184" class="s">control plane,</text><text x="20" y="200" class="s">SPI master to the FPGA</text><path d="M372 158 v8 h522 v-8" fill="none" stroke="#7cb6ff" stroke-width="1.3"/><text x="633.0" y="184" class="s" text-anchor="middle">DSP4 to DSP9 carry the 36 data channels</text><text x="633.0" y="200" class="s" text-anchor="middle">DSP4 is the one I hook in Parts 5 and 6</text>
