<svg xmlns="http://www.w3.org/2000/svg" width="1090" height="470" viewBox="0 0 1090 470" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="13" fill="#1a1a1a">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker></defs>
<text x="20" y="22" font-weight="600" font-size="14">Where the FlyBrain parts sit on one array, and what exists today</text>
<rect x="20" y="36" width="22" height="14" rx="3" fill="#f7f9fc" stroke="#2e7d32" stroke-width="1.5"/>
<text x="50" y="48" font-size="12">running today</text>
<rect x="151.8" y="36" width="22" height="14" rx="3" fill="#f7f9fc" stroke="#2c6cb0" stroke-width="1.5"/>
<text x="181.8" y="48" font-size="12">RTL or code, tested in simulation</text>
<rect x="415.59999999999997" y="36" width="22" height="14" rx="3" fill="#fdf8ee" stroke="#999999" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="445.59999999999997" y="48" font-size="12">design or draft only</text>
<rect x="20" y="120" width="170" height="118" rx="6" fill="#f7f9fc" stroke="#2e7d32" stroke-width="1.5"/><text x="105.0" y="148" text-anchor="middle" font-size="13" font-weight="600">SHARC DSPs</text>
<text x="105" y="182" text-anchor="middle" font-size="11.5" fill="#555555">beamforming</text>
<text x="105" y="198" text-anchor="middle" font-size="11.5" fill="#555555">(ClearOne firmware)</text>
<line x1="190" y1="160" x2="246" y2="160" stroke="#555555" stroke-width="1.5" marker-end="url(#ar)" stroke-dasharray="5 4"/>
<text x="218" y="150" text-anchor="middle" font-size="10.5" fill="#c0392b">no rx RTL</text>
<rect x="248" y="120" width="220" height="118" rx="6" fill="#f7f9fc" stroke="#2c6cb0" stroke-width="1.5"/><text x="358.0" y="148" text-anchor="middle" font-size="13" font-weight="600">Cyclone V: the ants</text>
<text x="358" y="182" text-anchor="middle" font-size="11.5" fill="#555555">one small classifier per</text>
<text x="358" y="198" text-anchor="middle" font-size="11.5" fill="#555555">beam or channel, at the mics</text>
<rect x="248" y="66" width="220" height="40" rx="6" fill="#f7f9fc" stroke="#2e7d32" stroke-width="1.5"/><text x="358.0" y="91.0" text-anchor="middle" font-size="12" font-weight="600">OMAP</text>
<text x="480" y="84" font-size="11" fill="#555555">loads images, sets registers,</text>
<text x="480" y="98" font-size="11" fill="#555555">metadata; not an audio path</text>
<line x1="526" y1="160" x2="584" y2="160" stroke="#555555" stroke-width="1.5" marker-end="url(#ar)" stroke-dasharray="5 4"/>
<line x1="468" y1="160" x2="528" y2="160" stroke="#555555" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="526" y="150" text-anchor="middle" font-size="10.5" fill="#555555">results sideband</text>
<text x="526" y="180" text-anchor="middle" font-size="10.5" fill="#555555">draft, zero on wire</text>
<rect x="586" y="120" width="230" height="118" rx="6" fill="#f7f9fc" stroke="#2c6cb0" stroke-width="1.5"/><text x="701.0" y="148" text-anchor="middle" font-size="13" font-weight="600">Zynq: the coordinator</text>
<text x="701" y="178" text-anchor="middle" font-size="11.5" fill="#555555">joins ant results and beams</text>
<text x="701" y="194" text-anchor="middle" font-size="11.5" fill="#555555">over short windows, picks</text>
<text x="701" y="210" text-anchor="middle" font-size="11.5" fill="#555555">beams, drops stale or gappy</text>
<text x="701" y="226" text-anchor="middle" font-size="11.5" fill="#555555">data; never reruns the ants</text>
<text x="701" y="254" text-anchor="middle" font-size="10.5" fill="#555555">bk3_brain: simulation only, being reworked</text>
<line x1="816" y1="160" x2="872" y2="160" stroke="#555555" stroke-width="1.5" marker-end="url(#ar)" stroke-dasharray="5 4"/>
<text x="844" y="150" text-anchor="middle" font-size="10.5" fill="#555555">events</text>
<rect x="874" y="120" width="196" height="118" rx="6" fill="#f7f9fc" stroke="#2e7d32" stroke-width="1.5"/><text x="972.0" y="148" text-anchor="middle" font-size="13" font-weight="600">Hub: fleet brain</text>
<text x="972" y="182" text-anchor="middle" font-size="11.5" fill="#555555">Perch, BirdNET,</text>
<text x="972" y="198" text-anchor="middle" font-size="11.5" fill="#555555">cross-array matching,</text>
<text x="972" y="214" text-anchor="middle" font-size="11.5" fill="#555555">review</text>
<path d="M105,238 L105,282 L972,282 L972,242" fill="none" stroke="#2e7d32" stroke-width="2" marker-end="url(#ar)"/>
<text x="540" y="275" text-anchor="middle" font-size="11.5" fill="#2e7d32">today: stock audio over Dante through the Zynq card (Part 9)</text>
<rect x="586" y="308" width="484" height="128" rx="6" fill="#fdf8ee" stroke="#999999" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="600" y="328" font-weight="600" font-size="12.5">What every event must carry (design)</text>
<text x="600" y="352" font-size="11.5">· array, boot epoch</text>
<text x="836" y="352" font-size="11.5">· exact sample range [start, end)</text>
<text x="600" y="371" font-size="11.5">· beam or channel id</text>
<text x="836" y="371" font-size="11.5">· gaps, padding, validity</text>
<text x="600" y="390" font-size="11.5">· model + preprocessing digest</text>
<text x="836" y="390" font-size="11.5">· what the score means</text>
<text x="600" y="409" font-size="11.5">· clock, frame and pose source</text>
<text x="836" y="409" font-size="11.5">· a link back to the raw audio</text>
<text x="20" y="348" font-size="12">Events with unknown alignment stay unjoined.</text>
<text x="20" y="366" font-size="12">A rounded wall-clock time is not a join key.</text>
<text x="20" y="384" font-size="12">Raw audio and derived scores stay separate.</text>
</svg>
