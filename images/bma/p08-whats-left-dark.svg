<rect x="80" y="230" width="700" height="52" rx="6" fill="#45403a" stroke="#9a9a9a" stroke-width="1.5" stroke-dasharray="5 4"/><text x="430.0" y="252.0" text-anchor="middle" font-size="13" font-weight="600">A controlled capture of the eight Dante channels</text><text x="430.0" y="269.0" text-anchor="middle" font-size="11.5" fill="#c9c9c9">Part 7</text>
<line x1="46" y1="272" x2="46" y2="302" stroke="#9a9a9a" stroke-width="1.5" stroke-dasharray="3 4"/>
<circle cx="46" cy="318" r="16" fill="#45403a" stroke="#9a9a9a" stroke-width="1.5"/><text x="46" y="323" text-anchor="middle" font-size="13" font-weight="600">5</text>
<rect x="80" y="292" width="700" height="52" rx="6" fill="#45403a" stroke="#9a9a9a" stroke-width="1.5" stroke-dasharray="5 4"/><text x="430.0" y="314.0" text-anchor="middle" font-size="13" font-weight="600">A bearing on a known source</text><text x="430.0" y="331.0" text-anchor="middle" font-size="11.5" fill="#c9c9c9">then two arrays with measured poses and verified geometry</text>
<line x1="46" y1="334" x2="46" y2="364" stroke="#9a9a9a" stroke-width="1.5" stroke-dasharray="3 4"/>
<circle cx="46" cy="380" r="16" fill="#45403a" stroke="#ff8a7a" stroke-width="1.5"/><text x="46" y="385" text-anchor="middle" font-size="13" font-weight="600">6</text>
