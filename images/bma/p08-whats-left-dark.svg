<text x="940" y="84" text-anchor="middle" font-size="12" fill="#c9c9c9">stock Dante audio</text><text x="940" y="102" text-anchor="middle" font-size="12" fill="#c9c9c9">through the hub and</text><text x="940" y="120" text-anchor="middle" font-size="12" fill="#c9c9c9">web dashboard</text><text x="940" y="138" text-anchor="middle" font-size="12" fill="#c9c9c9"></text><text x="940" y="156" text-anchor="middle" font-size="12" fill="#c9c9c9">Part 9</text>
<rect x="20" y="420" width="1050" height="39" rx="6" fill="#3b3f45" stroke="#9a9a9a" stroke-width="1.5"/><text x="36" y="441" text-anchor="start" font-size="11.5" fill="#f2f2f2">Every box on the left is undone. No bird has been tracked and no bearing has come from live array audio.</text>
