<circle cx="46" cy="194" r="16" fill="#45403a" stroke="#9a9a9a" stroke-width="1.5"/><text x="46" y="199" text-anchor="middle" font-size="13" font-weight="600">3</text>
<rect x="80" y="168" width="700" height="52" rx="6" fill="#45403a" stroke="#9a9a9a" stroke-width="1.5" stroke-dasharray="5 4"/><text x="430.0" y="190.0" text-anchor="middle" font-size="13" font-weight="600">Real samples through the PL ring reader and egress</text><text x="430.0" y="207.0" text-anchor="middle" font-size="11.5" fill="#c9c9c9">audio checker, then listen mode</text>
