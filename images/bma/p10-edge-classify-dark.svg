<svg xmlns="http://www.w3.org/2000/svg" width="1090" height="340" viewBox="0 0 1090 340" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="13" fill="#f2f2f2">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9c9c9"/></marker></defs>
<text x="20" y="22" font-weight="600" font-size="14">Classifying at the edge, and six ways to make it better</text>
<rect x="20" y="44" width="130" height="56" rx="6" fill="#3b3f45" stroke="#8a8a8a" stroke-width="1.5"/><text x="85.0" y="68.0" text-anchor="middle" font-size="12.5" font-weight="600">One beam</text><text x="85.0" y="85.0" text-anchor="middle" font-size="11.5" fill="#c9c9c9">48 kHz PCM</text>
<text x="85.0" y="118" text-anchor="middle" font-size="10.5" fill="#c9c9c9">exists</text>
<rect x="173" y="44" width="130" height="56" rx="6" fill="#3b3f45" stroke="#7cb6ff" stroke-width="1.5"/><text x="238.0" y="68.0" text-anchor="middle" font-size="12.5" font-weight="600">Ants</text><text x="238.0" y="85.0" text-anchor="middle" font-size="11.5" fill="#c9c9c9">one or several per beam</text>
<text x="238.0" y="118" text-anchor="middle" font-size="10.5" fill="#c9c9c9">simulation</text>
<line x1="150" y1="72" x2="173" y2="72" stroke="#c9c9c9" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="326" y="44" width="130" height="56" rx="6" fill="#3b3f45" stroke="#7cb6ff" stroke-width="1.5"/><text x="391.0" y="68.0" text-anchor="middle" font-size="12.5" font-weight="600">Codes</text><text x="391.0" y="85.0" text-anchor="middle" font-size="11.5" fill="#c9c9c9">64 bits, 8 to 12 hot</text>
<text x="391.0" y="118" text-anchor="middle" font-size="10.5" fill="#c9c9c9">simulation</text>
<line x1="303" y1="72" x2="326" y2="72" stroke="#c9c9c9" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="479" y="44" width="130" height="56" rx="6" fill="#3b3f45" stroke="#7cb6ff" stroke-width="1.5"/><text x="544.0" y="68.0" text-anchor="middle" font-size="12.5" font-weight="600">Head</text><text x="544.0" y="85.0" text-anchor="middle" font-size="11.5" fill="#c9c9c9">linear or MB</text>
<text x="544.0" y="118" text-anchor="middle" font-size="10.5" fill="#c9c9c9">simulation, synthetic</text>
<text x="544.0" y="131" text-anchor="middle" font-size="10.5" fill="#c9c9c9">training only</text>
<line x1="456" y1="72" x2="479" y2="72" stroke="#c9c9c9" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="632" y="44" width="130" height="56" rx="6" fill="#3b3f45" stroke="#7cb6ff" stroke-width="1.5"/><text x="697.0" y="68.0" text-anchor="middle" font-size="12.5" font-weight="600">Result</text><text x="697.0" y="85.0" text-anchor="middle" font-size="11.5" fill="#c9c9c9">class and 3 scores</text>
<text x="697.0" y="118" text-anchor="middle" font-size="10.5" fill="#c9c9c9">simulation</text>
<line x1="609" y1="72" x2="632" y2="72" stroke="#c9c9c9" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="785" y="44" width="130" height="56" rx="6" fill="#3b3f45" stroke="#9a9a9a" stroke-width="1.5" stroke-dasharray="5 4"/><text x="850.0" y="68.0" text-anchor="middle" font-size="12.5" font-weight="600">Event to hub</text><text x="850.0" y="85.0" text-anchor="middle" font-size="11.5" fill="#c9c9c9">no PCM in it</text>
<text x="850.0" y="118" text-anchor="middle" font-size="10.5" fill="#c9c9c9">design</text>
<line x1="762" y1="72" x2="785" y2="72" stroke="#c9c9c9" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="938" y="44" width="130" height="56" rx="6" fill="#3b3f45" stroke="#8a8a8a" stroke-width="1.5"/><text x="1003.0" y="68.0" text-anchor="middle" font-size="12.5" font-weight="600">Hub classifier</text><text x="1003.0" y="85.0" text-anchor="middle" font-size="11.5" fill="#c9c9c9">BirdNET, Perch</text>
<text x="1003.0" y="118" text-anchor="middle" font-size="10.5" fill="#c9c9c9">runs today</text>
<line x1="915" y1="72" x2="938" y2="72" stroke="#c9c9c9" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="20" y="150" width="340" height="86" rx="6" fill="#3b3f45" stroke="#9a9a9a" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="32" y="171" font-size="12.5" font-weight="600">Train on real audio</text>
<text x="32" y="191" text-anchor="start" font-size="11" fill="#c9c9c9">Hub detections label real windows.</text><text x="32" y="206" text-anchor="start" font-size="11" fill="#c9c9c9">Today the head has only seen</text><text x="32" y="221" text-anchor="start" font-size="11" fill="#c9c9c9">synthetic audio.</text>
<rect x="375" y="150" width="340" height="86" rx="6" fill="#3b3f45" stroke="#9a9a9a" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="387" y="171" font-size="12.5" font-weight="600">Several ants per beam</text>
<text x="387" y="191" text-anchor="start" font-size="11" fill="#c9c9c9">Different split points, as in the</text><text x="387" y="206" text-anchor="start" font-size="11" fill="#c9c9c9">plot above. Combine with MAX</text><text x="387" y="221" text-anchor="start" font-size="11" fill="#c9c9c9">or a quorum.</text>
<rect x="730" y="150" width="340" height="86" rx="6" fill="#3b3f45" stroke="#9a9a9a" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="742" y="171" font-size="12.5" font-weight="600">Keep level out of the class</text>
<text x="742" y="191" text-anchor="start" font-size="11" fill="#c9c9c9">Ratio and crossings moved by at</text><text x="742" y="206" text-anchor="start" font-size="11" fill="#c9c9c9">most 0.002 under a 12 dB shift.</text><text x="742" y="221" text-anchor="start" font-size="11" fill="#c9c9c9">Level gets its own gate.</text>
<rect x="20" y="248" width="340" height="86" rx="6" fill="#3b3f45" stroke="#9a9a9a" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="32" y="269" font-size="12.5" font-weight="600">Cheapest head that works</text>
<text x="32" y="289" text-anchor="start" font-size="11" fill="#c9c9c9">Linear is at most 12 int8 adds</text><text x="32" y="304" text-anchor="start" font-size="11" fill="#c9c9c9">per class. Keep the MB head only</text><text x="32" y="319" text-anchor="start" font-size="11" fill="#c9c9c9">if it wins on real recordings.</text>
<rect x="375" y="248" width="340" height="86" rx="6" fill="#3b3f45" stroke="#9a9a9a" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="387" y="269" font-size="12.5" font-weight="600">The hub corrects the edge</text>
<text x="387" y="289" text-anchor="start" font-size="11" fill="#c9c9c9">Hub verdicts become labels, the</text><text x="387" y="304" text-anchor="start" font-size="11" fill="#c9c9c9">head is retrained, weights are</text><text x="387" y="319" text-anchor="start" font-size="11" fill="#c9c9c9">re-exported with a hash.</text>
<rect x="730" y="248" width="340" height="86" rx="6" fill="#3b3f45" stroke="#9a9a9a" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="742" y="269" font-size="12.5" font-weight="600">Say unsure</text>
<text x="742" y="289" text-anchor="start" font-size="11" fill="#c9c9c9">Low scores or a code never seen in</text><text x="742" y="304" text-anchor="start" font-size="11" fill="#c9c9c9">training go up as unclassified,</text><text x="742" y="319" text-anchor="start" font-size="11" fill="#c9c9c9">never as a guess.</text>
</svg>
