<svg xmlns="http://www.w3.org/2000/svg" width="1090" height="290" viewBox="0 0 1090 290" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="13" fill="#1a1a1a">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker></defs>
<text x="20" y="22" font-weight="600" font-size="14">The path to a FlyBrain bench load: five gates, none passed yet</text>
<rect x="20" y="50" width="198" height="130" rx="6" fill="#fdf8ee" stroke="#999999" stroke-width="1.5" stroke-dasharray="5 4"/><text x="119.0" y="72" text-anchor="middle" font-size="13" font-weight="600">1. Freeze the contract</text>
<text x="119" y="92" text-anchor="middle" font-size="11.5" fill="#555555">Cyclone to Zynq link and</text><text x="119" y="108" text-anchor="middle" font-size="11.5" fill="#555555">exact bit mapping,</text><text x="119" y="124" text-anchor="middle" font-size="11.5" fill="#555555">reviewed against source</text>
<line x1="218" y1="135" x2="232" y2="135" stroke="#555555" stroke-width="1.5" marker-end="url(#ar)" stroke-dasharray="5 4"/>
<rect x="232" y="50" width="198" height="130" rx="6" fill="#fdf8ee" stroke="#999999" stroke-width="1.5" stroke-dasharray="5 4"/><text x="331.0" y="72" text-anchor="middle" font-size="13" font-weight="600">2. Replay offline</text>
<text x="331" y="92" text-anchor="middle" font-size="11.5" fill="#555555">recorded events with</text><text x="331" y="108" text-anchor="middle" font-size="11.5" fill="#555555">resets, gaps, reordering,</text><text x="331" y="124" text-anchor="middle" font-size="11.5" fill="#555555">model changes</text>
<line x1="430" y1="135" x2="444" y2="135" stroke="#555555" stroke-width="1.5" marker-end="url(#ar)" stroke-dasharray="5 4"/>
<rect x="444" y="50" width="198" height="130" rx="6" fill="#fdf8ee" stroke="#999999" stroke-width="1.5" stroke-dasharray="5 4"/><text x="543.0" y="72" text-anchor="middle" font-size="13" font-weight="600">3. Real recordings</text>
<text x="543" y="92" text-anchor="middle" font-size="11.5" fill="#555555">clean splits, calibrated</text><text x="543" y="108" text-anchor="middle" font-size="11.5" fill="#555555">scores, per-class numbers,</text><text x="543" y="124" text-anchor="middle" font-size="11.5" fill="#555555">linear and</text><text x="543" y="140" text-anchor="middle" font-size="11.5" fill="#555555">nearest-neighbour</text><text x="543" y="156" text-anchor="middle" font-size="11.5" fill="#555555">baselines</text>
<line x1="642" y1="135" x2="656" y2="135" stroke="#555555" stroke-width="1.5" marker-end="url(#ar)" stroke-dasharray="5 4"/>
<rect x="656" y="50" width="198" height="130" rx="6" fill="#fdf8ee" stroke="#999999" stroke-width="1.5" stroke-dasharray="5 4"/><text x="755.0" y="72" text-anchor="middle" font-size="13" font-weight="600">4. Synthesis and review</text>
<text x="755" y="92" text-anchor="middle" font-size="11.5" fill="#555555">timing and an independent</text><text x="755" y="108" text-anchor="middle" font-size="11.5" fill="#555555">RTL review</text>
<line x1="854" y1="135" x2="868" y2="135" stroke="#555555" stroke-width="1.5" marker-end="url(#ar)" stroke-dasharray="5 4"/>
<rect x="868" y="50" width="198" height="130" rx="6" fill="#fdf8ee" stroke="#999999" stroke-width="1.5" stroke-dasharray="5 4"/><text x="967.0" y="72" text-anchor="middle" font-size="13" font-weight="600">5. Bench load, one array</text>
<text x="967" y="92" text-anchor="middle" font-size="11.5" fill="#555555">its own review and</text><text x="967" y="108" text-anchor="middle" font-size="11.5" fill="#555555">sign-off</text>
<rect x="20" y="204" width="1050" height="73" rx="6" fill="#f7f9fc" stroke="#999999" stroke-width="1.5"/><text x="36" y="225" text-anchor="start" font-size="11.5" fill="#1a1a1a">Our Cyclone images already go through that last gate. The latest, a link probe with no FlyBrain logic in it,</text><text x="36" y="242" text-anchor="start" font-size="11.5" fill="#1a1a1a">got a NO-GO on 2026-11-20. A later probe load on one array passed its register checks and the array went</text><text x="36" y="259" text-anchor="start" font-size="11.5" fill="#1a1a1a">back to stock. No FlyBrain logic has been loaded on any array.</text>
</svg>
