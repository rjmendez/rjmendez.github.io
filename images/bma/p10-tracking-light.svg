<svg xmlns="http://www.w3.org/2000/svg" width="1090" height="460" viewBox="0 0 1090 460" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="13" fill="#1a1a1a">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker></defs>
<text x="20" y="22" font-weight="600" font-size="14">How a track is meant to live and drive beams (design; the tracker code is not proven on microphone audio)</text>
<rect x="20" y="50" width="140" height="56" rx="6" fill="#f7f9fc" stroke="#2c6cb0" stroke-width="1.5"/><text x="90.0" y="74.0" text-anchor="middle" font-size="13" font-weight="600">Ant onset</text><text x="90.0" y="91.0" text-anchor="middle" font-size="11.5" fill="#555555">an ant goes active</text>
<rect x="247" y="50" width="140" height="56" rx="6" fill="#fdf8ee" stroke="#999999" stroke-width="1.5" stroke-dasharray="5 4"/><text x="317.0" y="74.0" text-anchor="middle" font-size="13" font-weight="600">Candidate</text><text x="317.0" y="91.0" text-anchor="middle" font-size="11.5" fill="#555555">evidence kept</text>
<rect x="474" y="50" width="140" height="56" rx="6" fill="#fdf8ee" stroke="#999999" stroke-width="1.5" stroke-dasharray="5 4"/><text x="544.0" y="74.0" text-anchor="middle" font-size="13" font-weight="600">Track</text><text x="544.0" y="91.0" text-anchor="middle" font-size="11.5" fill="#555555">compatible hits</text>
<rect x="701" y="50" width="140" height="56" rx="6" fill="#fdf8ee" stroke="#999999" stroke-width="1.5" stroke-dasharray="5 4"/><text x="771.0" y="74.0" text-anchor="middle" font-size="13" font-weight="600">Coasting</text><text x="771.0" y="91.0" text-anchor="middle" font-size="11.5" fill="#555555">bounded, flagged</text>
<rect x="928" y="50" width="140" height="56" rx="6" fill="#fdf8ee" stroke="#999999" stroke-width="1.5" stroke-dasharray="5 4"/><text x="998.0" y="74.0" text-anchor="middle" font-size="13" font-weight="600">Expired</text><text x="998.0" y="91.0" text-anchor="middle" font-size="11.5" fill="#555555">ends explicitly</text>
<line x1="160" y1="84" x2="247" y2="84" stroke="#555555" stroke-width="1.5" marker-end="url(#ar)" stroke-dasharray="5 4"/>
<text x="203" y="66" text-anchor="middle" font-size="10" fill="#555555">beam and</text><text x="203" y="77" text-anchor="middle" font-size="10" fill="#555555">window</text>
<line x1="387" y1="84" x2="474" y2="84" stroke="#555555" stroke-width="1.5" marker-end="url(#ar)" stroke-dasharray="5 4"/>
<text x="430" y="66" text-anchor="middle" font-size="10" fill="#555555">later</text><text x="430" y="77" text-anchor="middle" font-size="10" fill="#555555">match</text>
<line x1="614" y1="84" x2="701" y2="84" stroke="#555555" stroke-width="1.5" marker-end="url(#ar)" stroke-dasharray="5 4"/>
<text x="657" y="66" text-anchor="middle" font-size="10" fill="#555555">no compatible</text><text x="657" y="77" text-anchor="middle" font-size="10" fill="#555555">hit</text>
<line x1="841" y1="84" x2="928" y2="84" stroke="#555555" stroke-width="1.5" marker-end="url(#ar)" stroke-dasharray="5 4"/>
<text x="884" y="66" text-anchor="middle" font-size="10" fill="#555555">bound</text><text x="884" y="77" text-anchor="middle" font-size="10" fill="#555555">reached</text>
<path d="M771,106 L771,128 L544,128 L544,108" fill="none" stroke="#555555" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<text x="657" y="143" text-anchor="middle" font-size="10" fill="#555555">a compatible hit returns</text>
<text x="20" y="160" text-anchor="start" font-size="11" fill="#555555">Competing candidates are kept side by side,</text><text x="20" y="176" text-anchor="start" font-size="11" fill="#555555">not merged. A single ring sum is not a bearing.</text>
<rect x="20" y="196" width="330" height="150" rx="6" fill="#f7f9fc" stroke="#2c6cb0" stroke-width="1.5" stroke-dasharray="5 4"/><text x="185.0" y="218" text-anchor="middle" font-size="13" font-weight="600">Inputs</text>
<text x="185" y="236" text-anchor="middle" font-size="11.5" fill="#555555">ant events: which beam, which window</text><text x="185" y="252" text-anchor="middle" font-size="11.5" fill="#555555">beam levels across the output streams</text><text x="185" y="268" text-anchor="middle" font-size="11.5" fill="#555555">(default 32, hard maximum 64)</text><text x="185" y="284" text-anchor="middle" font-size="11.5" fill="#555555">direction from beams (Part 8 estimator,</text><text x="185" y="300" text-anchor="middle" font-size="11.5" fill="#555555">run on generated signals only)</text>
<line x1="350" y1="270" x2="400" y2="270" stroke="#555555" stroke-width="1.5" marker-end="url(#ar)" stroke-dasharray="5 4"/>
<rect x="402" y="196" width="270" height="150" rx="6" fill="#fdf8ee" stroke="#999999" stroke-width="1.5" stroke-dasharray="5 4"/><text x="537.0" y="218" text-anchor="middle" font-size="13" font-weight="600">Tracker</text>
<text x="537" y="236" text-anchor="middle" font-size="11.5" fill="#555555">associates new hits to a track</text><text x="537" y="252" text-anchor="middle" font-size="11.5" fill="#555555">predicts only while coasting</text><text x="537" y="268" text-anchor="middle" font-size="11.5" fill="#555555">gives each track an id that</text><text x="537" y="284" text-anchor="middle" font-size="11.5" fill="#555555">survives re-steering</text>
<line x1="672" y1="270" x2="722" y2="270" stroke="#555555" stroke-width="1.5" marker-end="url(#ar)" stroke-dasharray="5 4"/>
<rect x="724" y="196" width="346" height="150" rx="6" fill="#fdf8ee" stroke="#999999" stroke-width="1.5" stroke-dasharray="5 4"/><text x="897.0" y="218" text-anchor="middle" font-size="13" font-weight="600">What a track drives</text>
<text x="897" y="236" text-anchor="middle" font-size="11.5" fill="#555555">a bounded bearing hint inside events</text><text x="897" y="252" text-anchor="middle" font-size="11.5" fill="#555555">beams re-pointed between reads: in the</text><text x="897" y="268" text-anchor="middle" font-size="11.5" fill="#555555">firmware source, not run on mic audio</text><text x="897" y="284" text-anchor="middle" font-size="11.5" fill="#555555">a reflex steer request: needs its own</text><text x="897" y="300" text-anchor="middle" font-size="11.5" fill="#555555">authorization, deadline and allowlist</text>
<rect x="20" y="372" width="1050" height="70" rx="6" fill="#f7f9fc" stroke="#999999" stroke-width="1.5"/>
<text x="36" y="394" text-anchor="start" font-size="11.5" fill="#1a1a1a">Today the ring-sum feature has no direction in it; tracking needs a spatial front end first.</text><text x="36" y="410" text-anchor="start" font-size="11.5" fill="#1a1a1a">Stale or invalid input stops a response and is reported as unavailable.</text><text x="36" y="426" text-anchor="start" font-size="11.5" fill="#1a1a1a">Whether steering changes what a beam hears has not been shown on this hardware.</text>
</svg>
