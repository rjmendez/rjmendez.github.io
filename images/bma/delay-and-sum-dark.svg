<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 582" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .lbl{fill:#e2e2e2;font-size:14px}
    .sm{fill:#b6b6b6;font-size:12px}
    .ttl{fill:#e2e2e2;font-size:18px;font-weight:600}
    .wave{stroke:#e7928a;stroke-width:2;fill:none}
    .guide{stroke:#7b7e82;stroke-width:1;stroke-dasharray:4 4;fill:none}
    .sig{stroke:#e2e2e2;stroke-width:1.5;fill:none}
    .box{fill:#404040;stroke:#e2e2e2;stroke-width:1.2}
    .el{fill:#e7928a;stroke:#eeb0aa;stroke-width:1.2}
  </style>

  <text class="ttl" x="30" y="36">Delay-and-sum: one beam from many microphones</text>

  <!-- ===== geometry panel ===== -->
  <!-- incoming source direction -->
  <text class="sm" x="742" y="56">source at angle &#952;</text>
  <!-- propagation arrow (down-left toward array) -->
  <line x1="780" y1="68" x2="540" y2="218" class="wave" marker-end="url(#arr)"/>
  <!-- three plane wavefronts, perpendicular to propagation -->
  <line x1="680" y1="41" x2="760" y2="169" class="wave"/>
  <line x1="620" y1="78" x2="700" y2="206" class="wave"/>
  <line x1="560" y1="116" x2="640" y2="244" class="wave"/>
  <text class="sm" x="712" y="200">plane wavefronts</text>

  <!-- broadside normal -->
  <line x1="300" y1="170" x2="300" y2="248" class="guide"/>
  <text class="sm" x="306" y="186">broadside</text>

  <!-- array baseline -->
  <line x1="120" y1="260" x2="480" y2="260" class="sig"/>
  <!-- 5 elements, spacing d = 80 px -->
  <g>
    <circle class="el" cx="140" cy="260" r="7"/>
    <circle class="el" cx="220" cy="260" r="7"/>
    <circle class="el" cx="300" cy="260" r="7"/>
    <circle class="el" cx="380" cy="260" r="7"/>
    <circle class="el" cx="460" cy="260" r="7"/>
  </g>
  <text class="sm" x="110" y="282">m0</text>
  <text class="sm" x="190" y="282">m1</text>
  <text class="sm" x="270" y="282">m2</text>
  <text class="sm" x="350" y="282">m3</text>
  <text class="sm" x="430" y="282">m4</text>

  <!-- element spacing d marker -->
  <line x1="380" y1="300" x2="460" y2="300" class="guide"/>
  <text class="sm" x="408" y="314">d</text>

  <!-- path-difference callout -->
  <text class="lbl" x="30" y="76">The wavefront reaches m4 first and m0 last.</text>
  <text class="lbl" x="30" y="96">Between neighbours the extra path is d&#183;sin&#952;, a delay of &#964; = d&#183;sin&#952; / c.</text>

  <!-- ===== signal-flow panel ===== -->
  <!-- drops from elements -->
  <line x1="140" y1="267" x2="140" y2="360" class="sig"/>
  <line x1="220" y1="267" x2="220" y2="360" class="sig"/>
  <line x1="300" y1="267" x2="300" y2="360" class="sig"/>
  <line x1="380" y1="267" x2="380" y2="360" class="sig"/>
  <line x1="460" y1="267" x2="460" y2="360" class="sig"/>

  <!-- compensating delay boxes: earliest-hit element gets the most delay -->
  <g>
    <rect class="box" x="112" y="360" width="56" height="30" rx="3"/><text class="sm" x="132" y="380">0</text>
    <rect class="box" x="192" y="360" width="56" height="30" rx="3"/><text class="sm" x="202" y="380">+1&#964;</text>
    <rect class="box" x="272" y="360" width="56" height="30" rx="3"/><text class="sm" x="282" y="380">+2&#964;</text>
    <rect class="box" x="352" y="360" width="56" height="30" rx="3"/><text class="sm" x="362" y="380">+3&#964;</text>
    <rect class="box" x="432" y="360" width="56" height="30" rx="3"/><text class="sm" x="442" y="380">+4&#964;</text>
  </g>
  <text class="sm" x="520" y="378">delay the early ones so all five line up</text>

  <!-- converge to summation -->
  <line x1="140" y1="390" x2="300" y2="446" class="sig"/>
  <line x1="220" y1="390" x2="300" y2="446" class="sig"/>
  <line x1="300" y1="390" x2="300" y2="446" class="sig"/>
  <line x1="380" y1="390" x2="300" y2="446" class="sig"/>
  <line x1="460" y1="390" x2="300" y2="446" class="sig"/>
  <circle cx="300" cy="460" r="16" class="box"/>
  <text class="lbl" x="293" y="466" font-size="18">&#931;</text>

  <!-- output beam -->
  <line x1="316" y1="460" x2="470" y2="460" class="sig" marker-end="url(#arr2)"/>
  <path d="M480 460 q10 -16 20 0 q10 16 20 0 q10 -16 20 0 q10 16 20 0" class="wave"/>
  <text class="lbl" x="486" y="440">beam output y(t)</text>
  <text class="sm" x="486" y="494">signals from direction &#952; add up;</text>
  <text class="sm" x="486" y="510">sound from elsewhere arrives misaligned and cancels.</text>

  <!-- device note -->
  <rect x="30" y="522" width="840" height="50" rx="4" fill="#4d3330" stroke="#af6156"/>
  <text class="sm" x="42" y="543">On the BMA360 this is stage D of the front end. A plain delay gives a &#8220;DsBeam&#8221;; swapping each &#964; for a per-band FIR</text>
  <text class="sm" x="42" y="561">(13 bands &#215; 1024 taps + an 8-tap fractional delay) gives a frequency-invariant &#8220;FiBeam&#8221;. The tile forms up to 12 at once.</text>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#e7928a"/></marker>
    <marker id="arr2" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#e2e2e2"/></marker>
  </defs>
</svg>
