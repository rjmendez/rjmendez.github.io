<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b6b6b6"/>
    </marker>
    <style>
      .ttl{font-size:18px;font-weight:600;fill:#e2e2e2}
      .hd{font-size:12px;font-weight:600;fill:#9d9d9d;letter-spacing:.5px}
      .lbl{font-size:13px;fill:#e2e2e2}
      .sm{font-size:11.5px;fill:#b6b6b6}
      .mono{font-family:Consolas,monospace;font-size:12px;fill:#e2e2e2}
      .monr{font-family:Consolas,monospace;font-size:12px;fill:#e7928a}
      .box{fill:#383838;stroke:#9d9d9d;stroke-width:1.4}
      .flow{stroke:#b6b6b6;stroke-width:2;fill:none}
      .wall{fill:#512e2a;stroke:#e7928a;stroke-width:1.3}
      .warn{fill:#564729;stroke:#fbdb8e;stroke-width:1.3}
      .good{fill:#374c37;stroke:#b3e5b5;stroke-width:1.3}
    </style>
  </defs>

  <text x="24" y="30" class="ttl">Loading a SHARC: the pipeline and the two places it broke</text>
  <text x="24" y="58" class="hd">THE LOAD PIPELINE</text>

  <rect x="24"  y="70" width="150" height="62" rx="5" class="box"/>
  <text x="99"  y="94" text-anchor="middle" class="lbl">.ldr image</text>
  <text x="99"  y="111" text-anchor="middle" class="sm">16-byte block</text>
  <text x="99"  y="125" text-anchor="middle" class="sm">headers</text>

  <rect x="204" y="70" width="160" height="62" rx="5" class="box"/>
  <text x="284" y="94" text-anchor="middle" class="lbl">board-ID check</text>
  <text x="284" y="111" text-anchor="middle" class="mono">getPCBAssembly()</text>
  <text x="284" y="125" text-anchor="middle" class="sm">runs before any clock</text>

  <rect x="394" y="70" width="140" height="62" rx="5" class="box"/>
  <text x="464" y="94" text-anchor="middle" class="lbl">clock over SPI</text>
  <text x="464" y="111" text-anchor="middle" class="sm">mode 1, 750 kHz,</text>
  <text x="464" y="125" text-anchor="middle" class="sm">4-byte words</text>

  <rect x="564" y="70" width="150" height="62" rx="5" class="box"/>
  <text x="639" y="94" text-anchor="middle" class="lbl">ready poll</text>
  <text x="639" y="111" text-anchor="middle" class="sm">0x10E bit for this</text>
  <text x="639" y="125" text-anchor="middle" class="sm">DSP, every word</text>

  <rect x="744" y="70" width="132" height="62" rx="5" class="box"/>
  <text x="810" y="94" text-anchor="middle" class="lbl">identify</text>
  <text x="810" y="111" text-anchor="middle" class="mono">00 00 05 02</text>
  <text x="810" y="127" text-anchor="middle" class="sm">12-byte reply</text>

  <line x1="174" y1="101" x2="202" y2="101" class="flow" marker-end="url(#ah)"/>
  <line x1="364" y1="101" x2="392" y2="101" class="flow" marker-end="url(#ah)"/>
  <line x1="534" y1="101" x2="562" y2="101" class="flow" marker-end="url(#ah)"/>
  <line x1="714" y1="101" x2="742" y2="101" class="flow" marker-end="url(#ah)"/>

  <line x1="284" y1="132" x2="284" y2="168" stroke="#e7928a" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="639" y1="132" x2="639" y2="168" stroke="#fbdb8e" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="810" y1="132" x2="810" y2="168" stroke="#b3e5b5" stroke-width="1.2" stroke-dasharray="3,3"/>

  <rect x="24" y="170" width="356" height="112" rx="6" class="wall"/>
  <text x="38" y="190" class="sm" fill="#e7928a" font-weight="600">WALL 1: the vendor loader dies before the DSP is touched</text>
  <text x="38" y="210" class="sm">MFG info is never loaded, so <tspan class="mono">getPCBAssembly()</tspan></text>
  <text x="38" y="226" class="sm">returns 0x15e and <tspan class="mono">strncmp(.., "ASY-0514")</tspan> faults.</text>
  <text x="38" y="248" class="monr">FIX: 12 bytes at vaddr 0xe1b8 (file 0x61b8)</text>
  <text x="38" y="266" class="mono">ldr r0,[pc]; bx lr; .word 0x2699c</text>

  <rect x="396" y="170" width="300" height="112" rx="6" class="warn"/>
  <text x="410" y="190" class="sm" fill="#fbdb8e" font-weight="600">WALL 2: the ready bits are active-low</text>
  <text x="410" y="210" class="mono">0x6400010E</text><text x="500" y="210" class="sm">read live from the DSP pads</text>
  <text x="410" y="228" class="sm">bit N <tspan font-weight="600">set</tspan> = DSP N <tspan font-weight="600">not</tspan> ready. Wait for it</text>
  <text x="410" y="244" class="sm">to clear before each word goes out.</text>
  <text x="410" y="266" class="mono">idle, DSP1 site empty: 0x0002</text>

  <rect x="712" y="170" width="164" height="112" rx="6" class="good"/>
  <text x="794" y="190" text-anchor="middle" class="sm" fill="#b3e5b5" font-weight="600">result</text>
  <text x="794" y="210" text-anchor="middle" class="sm">9 DSPs from empty</text>
  <text x="794" y="226" text-anchor="middle" class="sm">in 52 s, own loader</text>
  <text x="794" y="248" text-anchor="middle" class="mono">reply[3] = DSP index</text>
  <text x="794" y="266" text-anchor="middle" class="sm">(DSP0 replies all zeros)</text>
</svg>
