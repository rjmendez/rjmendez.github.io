<svg xmlns="http://www.w3.org/2000/svg" width="1090" height="450" viewBox="0 0 1090 450" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="13" fill="#f2f2f2">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9c9c9"/></marker></defs>
<text x="20" y="22" font-weight="600" font-size="14">What an ant can say, and its anomaly states (draft contract; nothing produces or consumes these yet)</text>
<rect x="20" y="44" width="500" height="250" rx="6" fill="#3b3f45" stroke="#7cb6ff" stroke-width="1.5" stroke-dasharray="5 4"/><text x="270.0" y="66" text-anchor="middle" font-size="13" font-weight="600">Anomaly state of one ant</text>
<rect x="44" y="100" width="130" height="54" rx="6" fill="#3b3f45" stroke="#7cb6ff" stroke-width="1.5"/><text x="109.0" y="123.0" text-anchor="middle" font-size="13" font-weight="600">warming</text><text x="109.0" y="140.0" text-anchor="middle" font-size="11.5" fill="#c9c9c9">baseline settling</text>
<rect x="204" y="100" width="130" height="54" rx="6" fill="#3b3f45" stroke="#7cb6ff" stroke-width="1.5"/><text x="269.0" y="123.0" text-anchor="middle" font-size="13" font-weight="600">ready</text><text x="269.0" y="140.0" text-anchor="middle" font-size="11.5" fill="#c9c9c9">baseline trusted</text>
<rect x="364" y="100" width="130" height="54" rx="6" fill="#3b3f45" stroke="#7cb6ff" stroke-width="1.5"/><text x="429.0" y="123.0" text-anchor="middle" font-size="13" font-weight="600">active</text><text x="429.0" y="140.0" text-anchor="middle" font-size="11.5" fill="#c9c9c9">off baseline</text>
<line x1="174" y1="127" x2="204" y2="127" stroke="#c9c9c9" stroke-width="1.5" marker-end="url(#ar)" stroke-dasharray="5 4"/>
<line x1="334" y1="117" x2="364" y2="117" stroke="#c9c9c9" stroke-width="1.5" marker-end="url(#ar)" stroke-dasharray="5 4"/>
<line x1="364" y1="139" x2="334" y2="139" stroke="#c9c9c9" stroke-width="1.5" marker-end="url(#ar)" stroke-dasharray="5 4"/>
<text x="349" y="110" text-anchor="middle" font-size="9.5" fill="#c9c9c9">onset</text><text x="349" y="156" text-anchor="middle" font-size="9.5" fill="#c9c9c9">clear</text>
<rect x="204" y="214" width="130" height="54" rx="6" fill="#45403a" stroke="#ff8a7a" stroke-width="1.5" stroke-dasharray="5 4"/><text x="269.0" y="237.0" text-anchor="middle" font-size="13" font-weight="600">unavailable</text><text x="269.0" y="254.0" text-anchor="middle" font-size="11.5" fill="#c9c9c9">input stale or missing</text>
<line x1="109" y1="154" x2="109" y2="214" stroke="#ff8a7a" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.0"/>
<line x1="269" y1="154" x2="269" y2="214" stroke="#ff8a7a" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.0"/>
<line x1="429" y1="154" x2="429" y2="214" stroke="#ff8a7a" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.0"/>
<path d="M269,154 L269,214" fill="none" stroke="#ff8a7a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<path d="M429,154 L429,241 L334,241" fill="none" stroke="#ff8a7a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<text x="36" y="232" text-anchor="start" font-size="11.5" fill="#ff8a7a">Unavailable is never</text><text x="36" y="248" text-anchor="start" font-size="11.5" fill="#ff8a7a">reported as clear.</text>
<text x="36" y="188" text-anchor="start" font-size="11" fill="#c9c9c9">Onset and clear are sent once,</text><text x="36" y="204" text-anchor="start" font-size="11" fill="#c9c9c9">as transitions.</text>
<rect x="540" y="44" width="530" height="250" rx="6" fill="#45403a" stroke="#9a9a9a" stroke-width="1.5" stroke-dasharray="5 4"/><text x="805.0" y="66" text-anchor="middle" font-size="13" font-weight="600">Six message kinds</text>
<rect x="556" y="78" width="240" height="60" rx="6" fill="#3b3f45" stroke="#9a9a9a" stroke-width="1.5" stroke-dasharray="5 4"/><text x="676" y="98" text-anchor="middle" font-size="12.5" font-weight="600">Anomaly</text>
<text x="676" y="116" text-anchor="middle" font-size="10.5" fill="#c9c9c9">left or rejoined baseline</text>
<rect x="811" y="78" width="240" height="60" rx="6" fill="#3b3f45" stroke="#9a9a9a" stroke-width="1.5" stroke-dasharray="5 4"/><text x="931" y="98" text-anchor="middle" font-size="12.5" font-weight="600">Reflex</text>
<text x="931" y="116" text-anchor="middle" font-size="10.5" fill="#c9c9c9">trigger fired; response applied,</text><text x="931" y="128" text-anchor="middle" font-size="10.5" fill="#c9c9c9">rejected or failed</text>
<rect x="556" y="148" width="240" height="60" rx="6" fill="#3b3f45" stroke="#9a9a9a" stroke-width="1.5" stroke-dasharray="5 4"/><text x="676" y="168" text-anchor="middle" font-size="12.5" font-weight="600">Acquire / track</text>
<text x="676" y="186" text-anchor="middle" font-size="10.5" fill="#c9c9c9">candidate appeared, updated,</text><text x="676" y="198" text-anchor="middle" font-size="10.5" fill="#c9c9c9">coasted or ended</text>
<rect x="811" y="148" width="240" height="60" rx="6" fill="#3b3f45" stroke="#9a9a9a" stroke-width="1.5" stroke-dasharray="5 4"/><text x="931" y="168" text-anchor="middle" font-size="12.5" font-weight="600">Enrichment</text>
<text x="931" y="186" text-anchor="middle" font-size="10.5" fill="#c9c9c9">extra class + model, calibration,</text><text x="931" y="198" text-anchor="middle" font-size="10.5" fill="#c9c9c9">uncertainty</text>
<rect x="556" y="218" width="240" height="60" rx="6" fill="#3b3f45" stroke="#9a9a9a" stroke-width="1.5" stroke-dasharray="5 4"/><text x="676" y="238" text-anchor="middle" font-size="12.5" font-weight="600">Colony signal</text>
<text x="676" y="256" text-anchor="middle" font-size="10.5" fill="#c9c9c9">trail, alarm or resource,</text><text x="676" y="268" text-anchor="middle" font-size="10.5" fill="#c9c9c9">bounded, with expiry</text>
<rect x="811" y="218" width="240" height="60" rx="6" fill="#3b3f45" stroke="#9a9a9a" stroke-width="1.5" stroke-dasharray="5 4"/><text x="931" y="238" text-anchor="middle" font-size="12.5" font-weight="600">Health / loss</text>
<text x="931" y="256" text-anchor="middle" font-size="10.5" fill="#c9c9c9">warm-up, stale input,</text><text x="931" y="268" text-anchor="middle" font-size="10.5" fill="#c9c9c9">drops, reset</text>
<rect x="20" y="316" width="1050" height="118" rx="6" fill="#3b3f45" stroke="#9a9a9a" stroke-width="1.5"/>
<text x="36" y="340" text-anchor="start" font-size="11.5" fill="#f2f2f2">A score is not an alarm, an alarm is not a target, and none of them is a command.</text><text x="36" y="357" text-anchor="start" font-size="11.5" fill="#f2f2f2">A peer's signal is evidence. A retransmission is not another ant. Ants seeing the same thing are not independent witnesses.</text><text x="36" y="374" text-anchor="start" font-size="11.5" fill="#f2f2f2">Shared trails and alarms are environment, separate from anything a model has learned.</text><text x="36" y="391" text-anchor="start" font-size="11.5" fill="#f2f2f2">A single-channel energy change is not a direction. A reflex path never blocks audio.</text><text x="36" y="408" text-anchor="start" font-size="11.5" fill="#f2f2f2">Acceptance: exact tests for every transition, and timing from a defined onset to the response. Synthetic replay is development evidence only.</text>
</svg>
