<svg xmlns="http://www.w3.org/2000/svg" width="1090" height="510" viewBox="0 0 1090 510" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="13" fill="#f2f2f2">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9c9c9"/></marker></defs>
<text x="20" y="22" font-weight="600" font-size="14">Where ants would talk to each other and to the hub (design; nothing here is wired)</text>
<rect x="20" y="44" width="300" height="250" rx="6" fill="#3b3f45" stroke="#7cb6ff" stroke-width="1.5" stroke-dasharray="5 4"/><text x="170.0" y="66" text-anchor="middle" font-size="13" font-weight="600">Cyclone V, at the mics</text>
<rect x="34" y="78" width="80" height="30" rx="6" fill="#3b3f45" stroke="#7cb6ff" stroke-width="1.5"/><text x="74.0" y="98.0" text-anchor="middle" font-size="12" font-weight="600">ant 1</text>
<line x1="74" y1="108" x2="74" y2="134" stroke="#c9c9c9" stroke-width="1.5" marker-end="url(#ar)" stroke-dasharray="5 4"/>
<rect x="126" y="78" width="80" height="30" rx="6" fill="#3b3f45" stroke="#7cb6ff" stroke-width="1.5"/><text x="166.0" y="98.0" text-anchor="middle" font-size="12" font-weight="600">ant 2</text>
<line x1="166" y1="108" x2="166" y2="134" stroke="#c9c9c9" stroke-width="1.5" marker-end="url(#ar)" stroke-dasharray="5 4"/>
<rect x="218" y="78" width="80" height="30" rx="6" fill="#3b3f45" stroke="#7cb6ff" stroke-width="1.5"/><text x="258.0" y="98.0" text-anchor="middle" font-size="12" font-weight="600">ant 3</text>
<line x1="258" y1="108" x2="258" y2="134" stroke="#c9c9c9" stroke-width="1.5" marker-end="url(#ar)" stroke-dasharray="5 4"/>
<rect x="32" y="136" width="276" height="148" rx="6" fill="#45403a" stroke="#9a9a9a" stroke-width="1.5" stroke-dasharray="5 4"/><text x="170.0" y="158" text-anchor="middle" font-size="13" font-weight="600">pheromone bus (proposal)</text>
<text x="170" y="176" text-anchor="middle" font-size="11" fill="#c9c9c9">per ant: trail, alarm, resource</text><text x="170" y="192" text-anchor="middle" font-size="11" fill="#c9c9c9">(8 bits each) + a detail word</text><text x="170" y="208" text-anchor="middle" font-size="11" fill="#c9c9c9">leaky decay once per 21.3 ms window</text><text x="170" y="224" text-anchor="middle" font-size="11" fill="#c9c9c9">alarms combine by MAX</text><text x="170" y="240" text-anchor="middle" font-size="11" fill="#c9c9c9">N-of-M quorum, hysteresis, cooldown</text>
<line x1="320" y1="150" x2="410" y2="150" stroke="#c9c9c9" stroke-width="1.5" marker-end="url(#ar)" stroke-dasharray="5 4"/>
<text x="365" y="136" text-anchor="middle" font-size="10.5" fill="#c9c9c9">results</text><text x="365" y="148" text-anchor="middle" font-size="10.5" fill="#c9c9c9">sideband</text>
<text x="365" y="172" text-anchor="middle" font-size="10.5" fill="#c9c9c9">draft;</text><text x="365" y="184" text-anchor="middle" font-size="10.5" fill="#c9c9c9">zero on</text><text x="365" y="196" text-anchor="middle" font-size="10.5" fill="#c9c9c9">the wire</text>
<rect x="412" y="44" width="280" height="250" rx="6" fill="#3b3f45" stroke="#7cb6ff" stroke-width="1.5" stroke-dasharray="5 4"/><text x="552.0" y="66" text-anchor="middle" font-size="13" font-weight="600">Zynq: second FlyBrain stage</text>
<text x="552" y="84" text-anchor="middle" font-size="11.5" fill="#c9c9c9">receives ant results and beam levels,</text><text x="552" y="100" text-anchor="middle" font-size="11.5" fill="#c9c9c9">keeps what it can prove aligned;</text><text x="552" y="116" text-anchor="middle" font-size="11.5" fill="#c9c9c9">stale or missing input is reported</text><text x="552" y="132" text-anchor="middle" font-size="11.5" fill="#c9c9c9">as unavailable, never as clear;</text><text x="552" y="148" text-anchor="middle" font-size="11.5" fill="#c9c9c9">retransmits do not count as extra ants;</text><text x="552" y="164" text-anchor="middle" font-size="11.5" fill="#c9c9c9"></text><text x="552" y="180" text-anchor="middle" font-size="11.5" fill="#c9c9c9">runs the tracker (next figure), packs</text><text x="552" y="196" text-anchor="middle" font-size="11.5" fill="#c9c9c9">events for the hub</text>
<text x="552" y="270" text-anchor="middle" font-size="10.5" fill="#ff8a7a">two sideband layouts compete for one</text><text x="552" y="283" text-anchor="middle" font-size="10.5" fill="#ff8a7a">slot; neither is approved</text>
<line x1="692" y1="120" x2="790" y2="120" stroke="#c9c9c9" stroke-width="1.5" marker-end="url(#ar)" stroke-dasharray="5 4"/>
<text x="741" y="104" text-anchor="middle" font-size="10.5" fill="#c9c9c9">evidence</text>
<line x1="790" y1="190" x2="692" y2="190" stroke="#c9c9c9" stroke-width="1.5" marker-end="url(#ar)" stroke-dasharray="5 4"/>
<text x="741" y="208" text-anchor="middle" font-size="10.5" fill="#c9c9c9">commands</text><text x="741" y="220" text-anchor="middle" font-size="10.5" fill="#c9c9c9">(proposal)</text>
<rect x="792" y="44" width="278" height="250" rx="6" fill="#3b3f45" stroke="#86d98f" stroke-width="1.5"/><text x="931.0" y="66" text-anchor="middle" font-size="13" font-weight="600">Hub: fleet brain</text>
<text x="931" y="84" text-anchor="middle" font-size="11.5" fill="#c9c9c9">Perch, BirdNET, review;</text><text x="931" y="100" text-anchor="middle" font-size="11.5" fill="#c9c9c9">matches events across arrays;</text><text x="931" y="116" text-anchor="middle" font-size="11.5" fill="#c9c9c9">each array counts as one ant,</text><text x="931" y="132" text-anchor="middle" font-size="11.5" fill="#c9c9c9">quorum of two or more arrays (proposal);</text><text x="931" y="148" text-anchor="middle" font-size="11.5" fill="#c9c9c9"></text><text x="931" y="164" text-anchor="middle" font-size="11.5" fill="#c9c9c9">commands: authenticated, expiring,</text><text x="931" y="180" text-anchor="middle" font-size="11.5" fill="#c9c9c9">acknowledged; receipt is not applied</text>
<rect x="792" y="330" width="278" height="70" rx="6" fill="#45403a" stroke="#9a9a9a" stroke-width="1.5" stroke-dasharray="5 4"/><text x="931.0" y="352" text-anchor="middle" font-size="13" font-weight="600">Sister array</text>
<text x="931" y="372" text-anchor="middle" font-size="11" fill="#c9c9c9">same stages, its own epoch and clock</text>
<line x1="931" y1="294" x2="931" y2="330" stroke="#c9c9c9" stroke-width="1.5" marker-end="url(#ar)" stroke-dasharray="5 4"/>
<line x1="931" y1="330" x2="931" y2="294" stroke="#c9c9c9" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<path d="M552,294 L552,365 L792,365" fill="none" stroke="#c9c9c9" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<text x="560" y="355" text-anchor="start" font-size="10.5" fill="#c9c9c9">peer path: through the hub or direct, undecided</text>
<rect x="20" y="420" width="1050" height="74" rx="6" fill="#3b3f45" stroke="#9a9a9a" stroke-width="1.5"/>
<text x="36" y="442" text-anchor="start" font-size="11.5" fill="#f2f2f2">A peer's signal is evidence, never a command. Ants that see the same thing are not independent witnesses.</text><text x="36" y="458" text-anchor="start" font-size="11.5" fill="#f2f2f2">Shared trail and alarm values are environment, separate from anything a model has learned.</text><text x="36" y="474" text-anchor="start" font-size="11.5" fill="#f2f2f2">No PCM and no precise coordinates in event metadata. Loops are stopped by origin and event identity.</text>
</svg>
