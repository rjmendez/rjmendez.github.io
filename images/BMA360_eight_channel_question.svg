<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .lbl{fill:#1a1a1a;font-size:13px}
    .sm{fill:#555;font-size:12px}
    .mono{font-family:Consolas, Menlo, monospace}
    .ttl{fill:#1a1a1a;font-size:18px;font-weight:600}
    .node{fill:#f4f4f4;stroke:#1a1a1a;stroke-width:1.2}
    .q{fill:#fff7e0;stroke:#b8860b;stroke-width:1.8}
    .off{fill:#fafafa;stroke:#9aa0a6;stroke-width:1.2;stroke-dasharray:5 4}
    .flow{stroke:#1a1a1a;stroke-width:1.5;fill:none}
    .branch{stroke:#b8860b;stroke-width:1.6;fill:none;stroke-dasharray:5 4}
    .good{fill:#eef7ee;stroke:#2e7d32;stroke-width:1.6}
    .bad{fill:#fdecea;stroke:#c0392b;stroke-width:1.6}
    .gt{fill:#1e6b23;font-size:13px;font-weight:600}
    .bt{fill:#a5281b;font-size:13px;font-weight:600}
  </style>

  <text class="ttl" x="30" y="32">The eight channels on the wire: what does the host receive?</text>

  <!-- ===== signal chain ===== -->
  <g>
    <rect class="node" x="26"  y="70" width="104" height="54" rx="4"/>
    <text class="lbl" x="44" y="94">121 MEMS</text><text class="sm" x="54" y="112">elements</text>

    <rect class="node" x="160" y="70" width="104" height="54" rx="4"/>
    <text class="lbl" x="188" y="94">Cyclone V</text><text class="sm" x="196" y="112">FPGA, TDM</text>

    <rect class="node" x="294" y="70" width="110" height="54" rx="4"/>
    <text class="lbl" x="318" y="94">SHARC DSPs</text><text class="sm" x="316" y="112">beamformer</text>

    <rect class="node" x="434" y="70" width="116" height="54" rx="4"/>
    <text class="lbl" x="452" y="94">Brooklyn-3</text><text class="sm" x="452" y="112">Zynq / Dante</text>

    <rect class="q"    x="580" y="70" width="104" height="54" rx="4"/>
    <text class="lbl" x="606" y="94">8 channels</text><text class="sm" x="612" y="112">on the wire</text>

    <rect class="off"  x="714" y="70" width="112" height="54" rx="4"/>
    <text class="lbl" x="732" y="92">off-array</text><text class="sm" x="729" y="110">DOA estimator</text>
  </g>

  <!-- chain arrows -->
  <g class="flow">
    <line x1="130" y1="97" x2="158" y2="97" marker-end="url(#a)"/>
    <line x1="264" y1="97" x2="292" y2="97" marker-end="url(#a)"/>
    <line x1="404" y1="97" x2="432" y2="97" marker-end="url(#a)"/>
    <line x1="550" y1="97" x2="578" y2="97" marker-end="url(#a)"/>
    <line x1="684" y1="97" x2="712" y2="97" marker-end="url(#a)"/>
  </g>
  <text class="sm" x="138" y="62">TDM</text>
  <text class="sm" x="272" y="62">TDM</text>
  <text class="sm" x="410" y="62">TDM ring</text>
  <text class="sm" x="556" y="62">Dante</text>

  <!-- ===== the fork ===== -->
  <text class="lbl" x="30" y="150" font-weight="600" fill="#b8860b">The captured configuration sends eight channels, not 121 separate microphones.</text>
  <text class="lbl" x="30" y="170" font-weight="600" fill="#b8860b">Their identity and processing need a controlled measurement.</text>

  <!-- branch lines from the 8-channel node -->
  <path d="M615 124 L615 190 L220 190 L220 232" class="branch" marker-end="url(#ab)"/>
  <path d="M648 124 C 700 160, 690 180, 685 232" class="branch" marker-end="url(#ab)"/>

  <!-- panel A: raw mics -->
  <rect class="good" x="30" y="234" width="400" height="136" rx="5"/>
  <text class="gt" x="46" y="258">IF they are RAW microphones</text>
  <text class="sm" x="46" y="282">Element signals can support a microphone-array model</text>
  <text class="sm" x="46" y="300">if channel identities and positions are verified.</text>
  <rect x="46" y="316" width="368" height="40" rx="3" fill="#ffffff" stroke="#bcd9bc"/>
  <text class="sm" x="56" y="333">Prediction: delays change with source position</text>
  <text class="sm" x="56" y="349">according to the measured microphone geometry.</text>

  <!-- panel B: gated beams -->
  <rect class="bad" x="470" y="234" width="400" height="136" rx="5"/>
  <text class="bt" x="486" y="258">IF they are GATED / FORMED beams</text>
  <text class="sm" x="486" y="282">Beamforming or gating is already in the signal.</text>
  <text class="sm" x="486" y="300">A different, calibrated estimator might recover direction.</text>
  <rect x="486" y="316" width="368" height="40" rx="3" fill="#ffffff" stroke="#e6c3bd"/>
  <text class="sm" x="496" y="333">Look for changes in level, delay and gating;</text>
  <text class="sm" x="496" y="349">their presence alone does not reconstruct the processing.</text>

  <!-- resolution / honest label -->
  <rect x="30" y="388" width="840" height="78" rx="4" fill="#f4f4f4" stroke="#cccccc"/>
  <text class="lbl" x="42" y="410" font-weight="600">Unresolved: channel identity in the tested configuration.</text>
  <text class="sm" x="42" y="432">Capture all channels at multiple known source positions; compare relative delays against measured geometry.</text>
  <text class="sm" x="42" y="450">Check channel-to-element mapping independently. The host BMAA format repackages the Dante samples.</text>

  <defs>
    <marker id="a"  markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#1a1a1a"/></marker>
    <marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#b8860b"/></marker>
  </defs>
</svg>
