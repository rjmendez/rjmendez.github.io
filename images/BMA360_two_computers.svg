<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 566" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#555"/>
    </marker>
    <style>
      .ttl{font-size:18px;font-weight:600;fill:#1a1a1a}
      .hd{font-size:12px;font-weight:600;fill:#777;letter-spacing:.5px}
      .lbl{font-size:13.5px;fill:#1a1a1a}
      .lb2{font-size:13px;font-weight:600;fill:#1a1a1a}
      .sm{font-size:11.5px;fill:#555}
      .mono{font-family:Consolas,monospace;font-size:11.5px;fill:#1a1a1a}
      .board{fill:#f7f9fc;stroke:#2c6cb0;stroke-width:1.6}
      .inner{fill:#fff;stroke:#999;stroke-width:1.2}
      .fab{fill:#eef4fb;stroke:#2c6cb0;stroke-width:1.2}
      .cpu{fill:#fdf4f3;stroke:#c0392b;stroke-width:1.2}
      .safe{fill:#fdf8ee;stroke:#b8860b;stroke-width:1.2}
      .live{fill:#eef7ee;stroke:#2e7d32;stroke-width:1.2}
    </style>
  </defs>

  <text x="24" y="30" class="ttl">Two computers in one tile, joined by two links</text>

  <!-- MAIN BOARD -->
  <rect x="24" y="52" width="344" height="168" rx="8" class="board"/>
  <text x="40" y="74" class="lb2">Main board</text>
  <rect x="40" y="86" width="312" height="40" rx="4" class="cpu"/>
  <text x="196" y="103" text-anchor="middle" class="lbl">OMAP-L138 &#8212; its own Linux (shell)</text>
  <text x="196" y="118" text-anchor="middle" class="sm">sees only 16 processed channels; no PCM</text>
  <rect x="40" y="132" width="151" height="78" rx="4" class="fab"/>
  <text x="115" y="152" text-anchor="middle" class="lbl">Cyclone V</text>
  <text x="115" y="170" text-anchor="middle" class="sm">PDM&#8594;PCM, FIR,</text>
  <text x="115" y="184" text-anchor="middle" class="sm">beamform matrix</text>
  <text x="115" y="201" text-anchor="middle" class="sm" fill="#2c6cb0">audio lives here</text>
  <rect x="201" y="132" width="151" height="78" rx="4" class="fab"/>
  <text x="276" y="152" text-anchor="middle" class="lbl">SHARC+ DSPs</text>
  <text x="276" y="170" text-anchor="middle" class="sm">beamform / AEC /</text>
  <text x="276" y="184" text-anchor="middle" class="sm">gating, 48 kHz</text>
  <text x="276" y="201" text-anchor="middle" class="sm" fill="#2c6cb0">on the TDM bus</text>

  <!-- BROOKLYN-3 CARD -->
  <rect x="532" y="52" width="344" height="168" rx="8" class="board"/>
  <text x="548" y="74" class="lb2">Brooklyn-3 card &#8212; Zynq XC7Z015</text>
  <rect x="548" y="86" width="312" height="52" rx="4" class="cpu"/>
  <text x="704" y="105" text-anchor="middle" class="lbl">Zynq PS &#8212; ARM, its own Linux</text>
  <text x="704" y="121" text-anchor="middle" class="sm">U-Boot 2019.01, 4.19 kernel, 14.3 MB rootfs</text>
  <text x="704" y="134" text-anchor="middle" class="sm" fill="#c0392b">also blind to PCM</text>
  <rect x="548" y="144" width="312" height="66" rx="4" class="fab"/>
  <text x="704" y="164" text-anchor="middle" class="lbl">Zynq PL (programmable logic)</text>
  <text x="704" y="182" text-anchor="middle" class="sm">packetizes the audio itself &#8212; the PS never</text>
  <text x="704" y="196" text-anchor="middle" class="sm">touches a sample. Dante egress only.</text>

  <!-- LINKS between the two boards -->
  <line x1="368" y1="100" x2="532" y2="100" stroke="#2c6cb0" stroke-width="2.4" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="450" y="92" text-anchor="middle" class="sm" fill="#2c6cb0" font-weight="600">audio: card-edge TDM bus</text>
  <text x="450" y="118" text-anchor="middle" class="sm">Mini-PCI Type III, 124-pin</text>

  <line x1="368" y1="180" x2="532" y2="180" stroke="#555" stroke-width="2.2" stroke-dasharray="6,3" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="450" y="172" text-anchor="middle" class="sm" font-weight="600">internal Ethernet (eth1)</text>
  <text x="450" y="198" text-anchor="middle" class="mono">LAN9500A &#8594; telnet :23</text>

  <!-- INSIGHT BAND -->
  <rect x="24" y="236" width="852" height="40" rx="6" fill="#2c6cb0" opacity="0.10"/>
  <text x="450" y="254" text-anchor="middle" class="lbl" fill="#2c6cb0">On each computer the <tspan font-weight="600">fabric</tspan> moves the audio &#8212; Cyclone on the main board, PL on the card.</text>
  <text x="450" y="270" text-anchor="middle" class="sm" fill="#2c6cb0">Both CPUs run Linux and have a shell; neither Linux ever sees a sample. "Just read the audio off its Linux" is not a path on either side.</text>

  <!-- FLASH MAP -->
  <text x="24" y="304" class="hd">BROOKLYN-3 FLASH (char maj 90) &#8212; SAFE / LIVE PARACHUTE PAIRS, ONE dd APART</text>

  <!-- safe column -->
  <rect x="24" y="316" width="250" height="150" rx="6" class="safe"/>
  <text x="149" y="336" text-anchor="middle" class="lb2" fill="#b8860b">safe (factory parachute)</text>
  <text x="40" y="360" class="mono">/dev/flash/fsbl        (stage-1)</text>
  <text x="40" y="382" class="mono">/dev/flash/safefpga</text>
  <text x="40" y="404" class="mono">/dev/flash/safeboot</text>
  <text x="40" y="426" class="mono">/dev/flash/safebootenv</text>
  <text x="40" y="452" class="sm">boots if the live set panics</text>

  <!-- live column -->
  <rect x="290" y="316" width="250" height="150" rx="6" class="live"/>
  <text x="415" y="336" text-anchor="middle" class="lb2" fill="#2e7d32">live (what runs)</text>
  <text x="306" y="360" class="mono">/dev/flash/fpga</text>
  <text x="306" y="382" class="mono">/dev/flash/boot + bootenv</text>
  <text x="306" y="404" class="mono">/dev/flash/kernel</text>
  <text x="306" y="426" class="mono">/dev/flash/rootfs</text>
  <text x="306" y="452" class="sm">nodes exist only on a running card</text>

  <!-- channel-ceiling note -->
  <rect x="556" y="316" width="320" height="150" rx="6" class="inner"/>
  <text x="716" y="336" text-anchor="middle" class="lb2">The 8-channel ceiling is a choice</text>
  <text x="572" y="360" class="sm">The Brooklyn-3 supports up to</text>
  <text x="572" y="376" class="sm">64&#215;64 @ 48 kHz over 8 SDIN / 8 SDOUT.</text>
  <text x="572" y="400" class="sm">Eight channels is the <tspan font-weight="600">main-board FPGA's</tspan></text>
  <text x="572" y="416" class="sm">TDM output config, not a card limit.</text>
  <text x="572" y="442" class="sm" fill="#2c6cb0">So "what are the 8 channels?" is a</text>
  <text x="572" y="458" class="sm" fill="#2c6cb0">question about the Cyclone, not this card.</text>

  <!-- bottom -->
  <rect x="24" y="482" width="852" height="60" rx="6" fill="#f7f7f7" stroke="#ccc"/>
  <text x="38" y="504" class="sm">Both computers now have a shell &#8212; OMAP Linux and Brooklyn-3 Linux &#8212; and the audio is reachable from neither.</text>
  <text x="38" y="524" class="sm">To get raw samples out through this card I'd have to put <tspan font-weight="600">my own logic in its PL</tspan>, not write a userspace program on it.</text>
  <text x="38" y="540" class="sm" fill="#555">(.dnt firmware update is network-pushed over Dante; there is no JTAG header on the card.)</text>
</svg>
