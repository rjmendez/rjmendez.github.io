<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#555"/>
    </marker>
    <marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c0392b"/>
    </marker>
    <marker id="ahg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2e7d32"/>
    </marker>
    <style>
      .ttl{font-size:18px;font-weight:600;fill:#1a1a1a}
      .hd{font-size:12px;font-weight:600;fill:#777;letter-spacing:.5px}
      .lbl{font-size:13.5px;fill:#1a1a1a}
      .sm{font-size:11.5px;fill:#555}
      .mono{font-family:Consolas,monospace;font-size:11.5px;fill:#1a1a1a}
      .monr{font-family:Consolas,monospace;font-size:11.5px;fill:#c0392b}
      .box{fill:#fff;stroke:#999;stroke-width:1.3}
      .audio{fill:#eef4fb;stroke:#2c6cb0;stroke-width:1.5}
      .omap{fill:#fdf4f3;stroke:#c0392b;stroke-width:1.5}
      .meter{fill:#eef7ee;stroke:#2e7d32;stroke-width:1.4}
      .flash{fill:#fdf8ee;stroke:#b8860b;stroke-width:1.4}
      .flow{stroke:#2c6cb0;stroke-width:2.2;fill:none}
      .red{stroke:#c0392b;stroke-width:1.6;fill:none}
      .grn{stroke:#2e7d32;stroke-width:1.8;fill:none}
    </style>
  </defs>

  <text x="24" y="30" class="ttl">The audio never reaches a register the OMAP can read</text>

  <!-- AUDIO DATAPATH BAND -->
  <text x="24" y="60" class="hd">THE AUDIO PATH &#8212; all of it on-fabric and on TDM buses</text>

  <rect x="24" y="72" width="120" height="58" rx="5" class="audio"/>
  <text x="84" y="96" text-anchor="middle" class="lbl">121 MEMS</text>
  <text x="84" y="113" text-anchor="middle" class="sm">PDM mics</text>

  <rect x="196" y="72" width="168" height="58" rx="5" class="audio"/>
  <text x="280" y="93" text-anchor="middle" class="lbl">Cyclone V FPGA</text>
  <text x="280" y="109" text-anchor="middle" class="sm">PDM&#8594;PCM, FIR, delays,</text>
  <text x="280" y="123" text-anchor="middle" class="sm">matrix &#8212; self-loaded</text>

  <rect x="416" y="72" width="150" height="58" rx="5" class="audio"/>
  <text x="491" y="93" text-anchor="middle" class="lbl">SHARC+ DSPs</text>
  <text x="491" y="109" text-anchor="middle" class="sm">beamform / AEC /</text>
  <text x="491" y="123" text-anchor="middle" class="sm">gating, 48 kHz</text>

  <rect x="618" y="72" width="150" height="58" rx="5" class="audio"/>
  <text x="693" y="93" text-anchor="middle" class="lbl">Brooklyn-3 Zynq</text>
  <text x="693" y="109" text-anchor="middle" class="sm">Dante card</text>
  <text x="693" y="123" text-anchor="middle" class="sm">8 Tx, off the tile</text>

  <!-- flows between audio stages -->
  <line x1="144" y1="101" x2="192" y2="101" class="flow" marker-end="url(#ah)"/>
  <line x1="364" y1="101" x2="412" y2="101" class="flow" marker-end="url(#ah)"/>
  <text x="390" y="92" text-anchor="middle" class="sm">TDM</text>
  <line x1="566" y1="101" x2="614" y2="101" class="flow" marker-end="url(#ah)"/>
  <text x="592" y="92" text-anchor="middle" class="sm">TDM</text>

  <!-- audio-lives-here banner -->
  <rect x="196" y="140" width="572" height="22" rx="4" fill="#2c6cb0" opacity="0.12"/>
  <text x="482" y="155" text-anchor="middle" class="sm" fill="#2c6cb0" font-weight="600">samples live on these TDM buses between the fabric and the DSPs &#8212; not in any memory-mapped register</text>

  <!-- OMAP SIDE -->
  <text x="24" y="206" class="hd">WHAT THE OMAP-L138 (heb_app.bin) CAN ACTUALLY TOUCH</text>

  <rect x="24" y="220" width="168" height="70" rx="5" class="omap"/>
  <text x="108" y="245" text-anchor="middle" class="lbl">OMAP-L138</text>
  <text x="108" y="262" text-anchor="middle" class="sm">runs heb_app.bin</text>
  <text x="108" y="278" text-anchor="middle" class="mono">/dev/c1fpga (maj 200)</text>

  <!-- single reach into CS4 -->
  <line x1="192" y1="255" x2="300" y2="255" class="red" marker-end="url(#ahr)"/>
  <text x="246" y="247" text-anchor="middle" class="sm" fill="#c0392b">EMIFA CS4 only</text>

  <!-- CS4 register window -->
  <rect x="300" y="200" width="300" height="168" rx="6" class="box"/>
  <text x="450" y="220" text-anchor="middle" class="lbl">CS4 window @ 0x64000000</text>
  <text x="450" y="237" text-anchor="middle" class="sm">16,128-word read-only sweep (fsweep.sh)</text>

  <rect x="316" y="248" width="268" height="60" rx="4" fill="#f4f4f4" stroke="#bbb"/>
  <text x="326" y="266" class="mono">bank 0  real regs: version, matrix, meters</text>
  <text x="326" y="282" class="mono">bank 1..15  2 KB MIRRORS of bank 0;</text>
  <text x="326" y="297" class="mono">  only word[+0x002] echoes the addr</text>

  <rect x="316" y="316" width="268" height="36" rx="4" fill="#fdf0ee" stroke="#c0392b"/>
  <text x="450" y="331" text-anchor="middle" class="monr">0 audio sample FIFOs in 32 KB</text>
  <text x="450" y="346" text-anchor="middle" class="sm" fill="#c0392b">the register route cannot carry a waveform</text>

  <!-- integrity guard note -->
  <text x="450" y="364" text-anchor="middle" class="sm">0x64000022 = 0x0117 (static) is the access-path integrity check</text>

  <!-- METERS: the one thing you can borrow -->
  <rect x="632" y="200" width="244" height="80" rx="6" class="meter"/>
  <text x="754" y="220" text-anchor="middle" class="lbl">Borrowed instrument</text>
  <text x="644" y="240" class="mono">write 0x90 = meter id</text>
  <text x="644" y="256" class="mono">read  0x92 &#8594; dB = 20 - (raw&gt;&gt;1)</text>
  <text x="754" y="274" text-anchor="middle" class="sm" fill="#2e7d32">levels only, no waveform</text>
  <line x1="600" y1="258" x2="628" y2="250" class="grn" marker-end="url(#ahg)"/>

  <!-- BITSTREAM -->
  <text x="24" y="412" class="hd">THE ONE STAGE YOU'D NEED TO CHANGE &#8212; AND CAN'T, YET</text>

  <rect x="24" y="426" width="168" height="58" rx="5" class="flash"/>
  <text x="108" y="450" text-anchor="middle" class="lbl">SPI NOR (mt25ql256)</text>
  <text x="108" y="468" text-anchor="middle" class="sm">the FPGA's own flash</text>

  <line x1="192" y1="455" x2="268" y2="455" class="flow" marker-end="url(#ah)"/>
  <text x="230" y="447" text-anchor="middle" class="sm">Active Serial</text>

  <rect x="268" y="426" width="180" height="58" rx="5" class="audio"/>
  <text x="358" y="450" text-anchor="middle" class="lbl">Cyclone V configures</text>
  <text x="358" y="468" text-anchor="middle" class="sm">itself at power-up</text>

  <rect x="468" y="426" width="408" height="58" rx="5" fill="#fdf4f3" stroke="#c0392b" stroke-width="1.4"/>
  <text x="672" y="448" text-anchor="middle" class="sm" fill="#c0392b" font-weight="600">Linux is never in the config path</text>
  <text x="672" y="467" text-anchor="middle" class="sm">opaque payload (CRC-16/ARC ok, ~6.6 entropy, no sync word)</text>

  <!-- bottom summary -->
  <rect x="24" y="504" width="852" height="60" rx="6" fill="#f7f7f7" stroke="#ccc"/>
  <text x="38" y="524" class="sm">The vendor stack gives register access, level meters, and DSP-load / matrix control &#8212; but <tspan fill="#c0392b" font-weight="600">never a sample</tspan>. The audio stays on the TDM bus into the SHARC+ DSPs.</text>
  <text x="38" y="542" class="sm">24 of the 121 elements (97&#8211;120) are silent in the shipped bitstream &#8212; aperture switched off in a fabric that cannot yet be rewritten.</text>
  <text x="38" y="560" class="sm" font-weight="600">So the only place left to stand is on the DSPs themselves.</text>
</svg>
